name: Hyperbolic KMS bridge (scoped)
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Core/DualSeedPeirce.lean'
      - 'lean/InfoGeometry/Core/HyperbolicPeirceRotor.lean'
      - 'lean/InfoGeometry/Canonical/HyperbolicEllipticKmsBridge.lean'
      - 'lean/InfoGeometry/Canonical/HyperbolicEllipticKmsBridgeAudit.lean'
      - 'tools/quality/check_hyperbolic_kms.py'
      - '.github/workflows/hyperbolic-kms.yml'
      - 'lean/InfoGeometry/Core/PeirceRotor.lean'
      - 'lean/InfoGeometry/Canonical/DeBruijnRotorAlternationCycle*.lean'
      - 'tools/quality/check_hyperbolic_kms.py'
      - '.github/workflows/peirce-rotor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peirce-rotor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source without initializing external submodules
        shell: bash
        env:
          SOURCE_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init project
          git -C project remote add origin "https://github.com/${{ github.repository }}.git"
          git -C project fetch --depth=1 origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          project = pathlib.Path('project')
          manifest = json.loads((project / 'lake-manifest.json').read_text())
          pin = next(p for p in manifest['packages'] if p['name'] == 'mathlib')
          subprocess.run(['git', 'init', 'pinned-mathlib'], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'remote', 'add', 'origin', pin['url']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'fetch', '--depth=1', 'origin', pin['rev']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Compile full source closure and audit new declarations
        shell: bash
        run: |
          set -euo pipefail
          ps -eo pid,comm,args
          python3 project/tools/quality/check_hyperbolic_kms.py \
            --mathlib-root pinned-mathlib --output verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperbolic-kms-verification
          path: |
            verification/**/*.log
            verification/**/*.json
            verification/**/*.txt
            verification/src
