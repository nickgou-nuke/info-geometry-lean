      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/KMSOperatorMonodromy.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/PeirceLogisticBitwordBridge.lean'
