name: Ordered homotopes and twistor invariants

on:
  pull_request:
    paths:
      - 'lean/**'
      - 'verification/twistor-homotope/**'
      - 'tools/build_lock.py'
      - 'tools/infra/build.py'
      - 'tools/infra/opengauss*.py'
      - 'tools/quality/proof_proxy_staged_gate.py'
      - 'scripts/vacuity-linter.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'pyproject.toml'
      - '.github/workflows/twistor-homotope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twistor-homotope-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the repository-pinned source-gate dependency
        run: python -m pip install 'jsonschema==4.23.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            verification/twistor-homotope/.lake
          key: ${{ runner.os }}-twistor-homotope-${{ hashFiles('verification/twistor-homotope/lean-toolchain', 'verification/twistor-homotope/lake-manifest.json') }}
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1
      - name: Retrieve the pinned dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/twistor-homotope/logs
          python3 verification/twistor-homotope/check.py exe cache get 2>&1 | tee verification/twistor-homotope/logs/cache.log
      - name: Build, audit, and run scoped source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/twistor-homotope/check.py env python3 "$PWD/verification/twistor-homotope/verify.py" 2>&1 | tee verification/twistor-homotope/logs/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twistor-homotope-verification
          path: verification/twistor-homotope/logs
