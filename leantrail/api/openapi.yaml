openapi: 3.1.0
info:
  title: LeanTrail API
  version: 0.2.0
  description: |
    Lean-native semantic exploration API over normalized DAG/process artifacts.
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is up
  /search:
    get:
      summary: Search nodes by substring
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Search results
  /decl/{name}:
    get:
      summary: Fetch declaration details and local edge context
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Declaration payload
        '404':
          description: Not found
  /neighborhood/{name}:
    get:
      summary: Extract radius-bounded neighborhood
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: radius
          schema:
            type: integer
            minimum: 1
            maximum: 8
      responses:
        '200':
          description: Neighborhood payload
  /path:
    get:
      summary: Shortest path query
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: lawful_only
          schema:
            type: boolean
        - in: query
          name: state_policy
          description: Edge-state traversal filter (`any`, `exclude-failed`, `locked-only`)
          schema:
            type: string
            enum: [any, exclude-failed, locked-only]
      responses:
        '200':
          description: Path payload
  /proofstate:
    get:
      summary: Proofstate bridge surface (stub contract)
      parameters:
        - in: query
          name: file
          required: true
          schema:
            type: string
        - in: query
          name: line
          required: true
          schema:
            type: integer
        - in: query
          name: col
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Proofstate payload (stub + nearby declarations)
  /coherence/hotspots:
    get:
      summary: Return coherence and violation hotspots
      responses:
        '200':
          description: Hotspot payload
  /holonomy/hotspots:
    get:
      summary: Return declaration-level holonomy hotspots
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - in: query
          name: alpha
          schema:
            type: number
        - in: query
          name: beta
          schema:
            type: number
        - in: query
          name: gamma
          schema:
            type: number
        - in: query
          name: min_score
          schema:
            type: number
      responses:
        '200':
          description: Holonomy hotspot payload
  /bridge-candidate:
    post:
      summary: Validate and persist candidate bridge packet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/leantrail_bridge_request.schema.json
      responses:
        '201':
          description: Packet persisted
        '400':
          description: Validation failed
