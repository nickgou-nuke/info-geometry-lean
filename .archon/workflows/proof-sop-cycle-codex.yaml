name: proof-sop-cycle-codex
description: |
  Use when: The cleanup heartbeat needs one bounded proof-cleanup cycle executed by Codex.
  Triggers: "codex proof cleanup cycle", "proof sop codex", "one codex cleanup".
  Does: Loads the proof-only SOP, selects one heartbeat target, performs one real cleanup,
        validates touched Lean files, commits, and pushes.
  NOT for: Unbounded supervision; use proof-cleanup-forever with WORKFLOW=proof-sop-cycle-codex.

provider: codex
model: gpt-5.3-codex
modelReasoningEffort: medium
webSearchMode: disabled

nodes:
  - id: cleanup-cycle
    command: proof-sop-cycle-codex
    always_run: true
