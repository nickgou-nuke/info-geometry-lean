name: Drazin MP partitions (pinned, scoped)

on:
  push:
    branches: [feat/drazin-mp-sector-partitions]
  pull_request:
    paths:
      - 'lean/InfoGeometry/Canonical/DrazinRegularization.lean'
      - 'lean/InfoGeometry/Canonical/DrazinMoorePenrosePartition*.lean'
      - 'lean/InfoGeometry/Canonical/InversePartitionExamples.lean'
      - 'lean/InfoGeometry/Singular/MoorePenroseSectors.lean'
      - 'lean/InfoGeometry/Singular/MoorePenrosePowerShells.lean'
      - '.github/workflows/drazin-mp-partitions.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'

permissions:
  contents: read

concurrency:
  group: drazin-mp-partitions-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  scoped-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Remove local read-only checkout credential without traversing submodules
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Install exact repository Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Compile exact owner closure and audit new declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fcntl, json, os, pathlib, re, shutil, subprocess
          repo = pathlib.Path.cwd()
          lock = open('/tmp/info-geometry-build.lock', 'a')
          fcntl.flock(lock, fcntl.LOCK_EX)
          active = subprocess.check_output(['ps', '-eo', 'pid,comm'], text=True)
          if any(line.split()[-1] in {'lean', 'lake', 'pytest'} for line in active.splitlines() if line.split()):
              raise RuntimeError('Another compiler or test process is active')
          pin = next(p for p in json.loads((repo/'lake-manifest.json').read_text())['packages'] if p['name']=='mathlib')
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'drazin-mp-mathlib'
          package = pathlib.Path(os.environ['RUNNER_TEMP'])/'drazin-mp-deliverable'
          package.mkdir()
          logs=[]
          def run(*args, cwd=repo, verbose=False):
              result=subprocess.run(args,cwd=cwd,capture_output=True,text=True)
              if verbose or result.returncode:
                  text=result.stdout+result.stderr
                  logs.append(text)
                  print(text,flush=True)
              result.check_returncode()
              return result.stdout
          print('MATHLIB_PIN',pin['rev'],flush=True)
          run('git','init',str(work))
          run('git','-C',str(work),'remote','add','origin',pin['url'])
          run('git','-C',str(work),'fetch','--depth=1','origin',pin['rev'])
          run('git','-C',str(work),'checkout','--detach','FETCH_HEAD')
          assert (work/'lean-toolchain').read_text().strip()==(repo/'lean-toolchain').read_text().strip()
          run('lake','exe','cache','get',cwd=work)
          targets=['InfoGeometry.Canonical.DrazinRegularization',
                   'InfoGeometry.Singular.MoorePenroseSectors',
                   'InfoGeometry.Canonical.DrazinMoorePenrosePartition',
                   'InfoGeometry.Singular.MoorePenrosePowerShells',
                   'InfoGeometry.Canonical.InversePartitionExamples',
                   'InfoGeometry.Canonical.DrazinMoorePenrosePartitionAll']
          seen,order=set(),[]
          def visit(module):
              if module in seen: return
              seen.add(module)
              relative=pathlib.Path(*module.split('.')).with_suffix('.lean')
              source=repo/'lean'/relative
              if not source.is_file(): raise RuntimeError(f'Missing owner {module}')
              for dep in re.findall(r'^\s*(?:public\s+)?import\s+([\w.]+)',source.read_text(),re.M):
                  if not dep.startswith(('Mathlib','Lean','Std','Init','Batteries')): visit(dep)
              order.append((module,relative,source))
          for module in targets: visit(module)
          print('OWNER_CLOSURE',[m for m,_,_ in order],flush=True)
          audit=['import InfoGeometry.Canonical.DrazinMoorePenrosePartitionAll',
                 'import InfoGeometry.Canonical.InversePartitionExamples']
          heads=[]
          for module,relative,source in order:
              text=source.read_text()
              if module in targets:
                  if re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',text):
                      raise RuntimeError('Forbidden proof construct in new source')
                  names=re.findall(r'^(?:@\[[^\]]*\]\s*)?(?:theorem|lemma|def)\s+(\w+)',text,re.M)
                  heads.extend(module+'.'+name for name in names)
                  dest=package/'lean'/relative
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,dest)
              destination=work/relative
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,destination)
              output=work/'.lake/build/lib/lean'/relative.with_suffix('.olean')
              output.parent.mkdir(parents=True,exist_ok=True)
              print('CHECK',module,flush=True)
              run('lake','env','lean','-o',str(output),str(relative),cwd=work,verbose=True)
          audit.extend('#print axioms '+name for name in heads)
          (work/'DrazinMPAudit.lean').write_text('\n'.join(audit)+'\n')
          text=run('lake','env','lean','DrazinMPAudit.lean',cwd=work,verbose=True)
          footprints=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text,re.S)
          empty=re.findall(r'does not depend on any axioms',text)
          assert len(footprints)+len(empty)==len(heads),'Missing declaration audit'
          for footprint in footprints:
              assert {x.strip() for x in footprint.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},footprint
          print('AUDITED_DECLARATIONS',len(heads),flush=True)
          (package/'audit.txt').write_text(text)
          (package/'compile.txt').write_text('\n'.join(logs))
          (package/'status.json').write_text(json.dumps({'source_commit':run('git','rev-parse','HEAD').strip(),
              'mathlib_commit':pin['rev'],'lean_toolchain':(repo/'lean-toolchain').read_text().strip(),
              'audited_declarations':heads,'scope':'new modules plus unchanged repository import closure; not full repository',
              'workflow_run':os.environ['GITHUB_RUN_ID'],'result':'success'},indent=2))
          shutil.copyfile(repo/'docs/DRAZIN_MP_PARTITION_PROOFS.md',package/'README.md')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DrazinMoorePenrosePartitions
          path: ${{ runner.temp }}/drazin-mp-deliverable
          if-no-files-found: error
