name: Gauss-Jordan kernel check

on:
  pull_request:
    branches: [main]
    paths:
      - "lean/InfoGeometry/Algebra/GaussJordan.lean"
      - "lean/InfoGeometry/Algebra/GaussJordan/**"
      - ".github/workflows/gauss-jordan.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib checkout and oleans
        id: mathlib-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages/mathlib
          key: ${{ runner.os }}-mathlib-v4.28.0
      - name: Prepare Mathlib v4.28.0
        run: |
          if [ ! -f .lake/packages/mathlib/lakefile.lean ]; then
            rm -rf .lake/packages/mathlib
            mkdir -p .lake/packages
            git clone --depth 1 --branch v4.28.0 \
              https://github.com/leanprover-community/mathlib4.git \
              .lake/packages/mathlib
          fi
          cd .lake/packages/mathlib
          lake exe cache get
      - name: Save Mathlib checkout and oleans
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages/mathlib
          key: ${{ runner.os }}-mathlib-v4.28.0
      - name: Build Gauss-Jordan module
        id: lean-build
        continue-on-error: true
        run: |
          cd .lake/packages/mathlib
          ln -s "$GITHUB_WORKSPACE/lean/InfoGeometry" InfoGeometry
          LEAN_PATH="$PWD" lake env lean InfoGeometry/Algebra/GaussJordan.lean \
            > "$GITHUB_WORKSPACE/gauss-jordan-build.log" 2>&1
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauss-jordan-build-log
          path: gauss-jordan-build.log
          if-no-files-found: error
      - name: Enforce successful kernel check
        if: always()
        run: |
          cat gauss-jordan-build.log
          test "${{ steps.lean-build.outcome }}" = success
