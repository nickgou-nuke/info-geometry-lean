name: Peirce defect boundaries

on:
  pull_request:
    paths:
      - 'lean/**/*.lean'
      - 'verification/peirce-defect-boundaries/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'tools/build_lock.py'
      - 'tools/infra/build.py'
      - 'tools/infra/opengauss_screener.py'
      - 'tools/pathing.py'
      - '.github/workflows/peirce-defect-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peirce-defect-boundaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: real-plucker-lean4341-d13f23b7-${{ runner.os }}-v1
      - name: Restore checked source artifacts
        id: source
        uses: actions/cache/restore@v4
        with:
          path: verification/peirce-defect-boundaries/.lake/build
          key: peirce-defect-source-lean4341-d13f23b7-${{ runner.os }}-${{ hashFiles('lean/**/*.lean', 'verification/peirce-defect-boundaries/lakefile.toml', 'verification/peirce-defect-boundaries/lake-manifest.json') }}
          restore-keys: |
            peirce-defect-source-lean4341-d13f23b7-${{ runner.os }}-
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1
      - name: Restore the pinned Mathlib artifacts
        run: python3 verification/peirce-defect-boundaries/check.py exe cache get
      - name: Check complete source inventory
        run: python3 verification/peirce-defect-boundaries/audit.py
      - name: Build source owners
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/peirce-defect-boundaries/check.py build 2>&1 | tee peirce-defect-build.log
      - name: Inspect transitive axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/peirce-defect-boundaries/check.py env lean lean/InfoGeometry/OperatorAlgebra/PeirceDefectBoundaryAudit.lean 2>&1 | tee peirce-defect-axioms.log
          python3 verification/peirce-defect-boundaries/audit.py --log peirce-defect-axioms.log
      - name: Screen new mathematics
        run: >-
          python3 tools/infra/opengauss_screener.py --strict
          lean/InfoGeometry/Algebra/CommutingInvolutionProjection.lean
          lean/InfoGeometry/Algebra/OrthogonalPolynomial.lean
          lean/InfoGeometry/OperatorAlgebra/PeirceSpine/CyclotomicUnitRepresentation.lean
          lean/InfoGeometry/OperatorAlgebra/PeirceSpine/ReynoldsProjection.lean
          lean/InfoGeometry/OperatorAlgebra/PeirceSpine/PeirceHilbertPositivity.lean
          lean/InfoGeometry/OperatorAlgebra/PeirceSpine/PeirceOverlapCounterexamples.lean
          lean/InfoGeometry/OperatorAlgebra/PeirceSpine/DefectNoncollapseMatrix.lean
      - name: Save pinned dependency artifacts
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save checked source artifacts
        if: always() && steps.source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: verification/peirce-defect-boundaries/.lake/build
          key: ${{ steps.source.outputs.cache-primary-key }}
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peirce-defect-boundaries-build
          path: |
            peirce-defect-build.log
            peirce-defect-axioms.log
