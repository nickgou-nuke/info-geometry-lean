name: Bipolar Period Schwarzian Narrow Check

on:
  pull_request:
    paths:
      - "lean/InfoGeometry/Analysis/BipolarPeriodDescent.lean"
      - "lean/InfoGeometry/Analysis/BipolarSignedLogConventionBridge.lean"
      - "lean/InfoGeometry/Analysis/BipolarSimplePoleResidues.lean"
      - "lean/InfoGeometry/Analysis/BipolarWindingExactSequence.lean"
      - "lean/InfoGeometry/Analysis/BipolarNativeExpCoveringBridge.lean"
      - "lean/InfoGeometry/Conformal/ComplexSchwarzianJet.lean"
      - "lean/InfoGeometry/Conformal/BipolarSchwarzianProjectiveConnection.lean"
      - "lean/InfoGeometry/Conformal/BipolarSignedLogSchwarzianBridge.lean"
      - "lean/InfoGeometry/Conformal/BipolarVirasoroProjectiveConnection.lean"
      - "lean/InfoGeometry/Canonical/BipolarPeriodAdjointDescentBridge.lean"
      - "lean/InfoGeometry/Canonical/BipolarWittProjectiveWardBridge.lean"
      - "lean/InfoGeometry/Canonical/BipolarSchwarzianWardPristineChain.lean"
      - "lean/InfoGeometry/Canonical/BipolarConformalLogos.lean"
      - ".github/workflows/bipolar-period-schwarzian-narrow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrow-kernel-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build focused owners in isolated Mathlib project
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/bipolar-period-schwarzian-check"
          mkdir -p "$work"
          cd "$work"

          cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain

          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package bipolarPeriodSchwarzianCheck

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @
              "8f9d9cff6bd728b17a24e163c9402775d9e6a365"

          @[default_target]
          lean_lib InfoGeometry
          EOF

          ln -s "$GITHUB_WORKSPACE/lean/InfoGeometry" InfoGeometry

          lake update
          lake exe cache get
          lake build InfoGeometry.Analysis.BipolarSimplePoleResidues
          lake build InfoGeometry.Analysis.BipolarNativeExpCoveringBridge
          lake build InfoGeometry.Conformal.BipolarSignedLogSchwarzianBridge
          lake build InfoGeometry.Canonical.BipolarSchwarzianWardPristineChain
          lake build InfoGeometry.Canonical.BipolarConformalLogos
