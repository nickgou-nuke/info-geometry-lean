name: Freed Pin compatibility

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Clifford/Freed*.lean'
      - 'lean/InfoGeometry/Clifford/NormalizedVectorPin.lean'
      - 'lean/InfoGeometry/Clifford/Cl11*.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/GradedMatrixMorita.lean'
      - 'lean/InfoGeometry/Geometry/KleinPin*.lean'
      - 'lean/InfoGeometry/KK/LinearDirac*.lean'
      - 'lean/InfoGeometry/KK/Pin*Transport.lean'
      - 'lean/InfoGeometry/KK/FreedPin*.lean'
      - 'lean/InfoGeometry/KK/CompactPhaseObstruction.lean'
      - 'lean/InfoGeometry/Canonical/SplitClifford*.lean'
      - 'lean/InfoGeometry/Canonical/MaurerCartanCurvature.lean'
      - 'lean/InfoGeometry/Canonical/BogoliubovVielbein.lean'
      - 'lean/InfoGeometry/Canonical/QuasilatticeDirac.lean'
      - 'verification/freed-pin-compatibility/**'
      - 'tools/build_lock.py'
      - 'tools/infra/build.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/freed-pin-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freed-pin-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch the exact public source without traversing external submodules
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$SOURCE_REPOSITORY.git"
          git -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin "$SOURCE_REVISION"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/cache/restore@v4
        id: pinned_cache
        with:
          path: |
            ~/.elan
            .lake/packages
          key: freed-pin-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'verification/freed-pin-compatibility/lake-manifest.json') }}
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Hydrate the exact focused dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/freed-pin-compatibility/artifacts
          python3 verification/freed-pin-compatibility/check.py exe cache get \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/cache.log
          git diff --exit-code -- lean-toolchain lake-manifest.json \
            verification/freed-pin-compatibility/lean-toolchain \
            verification/freed-pin-compatibility/lake-manifest.json
      - name: Save the hydrated pinned dependencies
        if: steps.pinned_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ steps.pinned_cache.outputs.cache-primary-key }}
      - name: Build representation, geometric, and domain foundations
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/freed-pin-compatibility/check.py build \
            InfoGeometry.OperatorAlgebra.GradedMatrixMorita \
            InfoGeometry.Clifford.FreedPinRepresentation \
            InfoGeometry.Geometry.KleinPinDirac \
            InfoGeometry.KK.LinearDiracTransport \
            InfoGeometry.KK.CompactPhaseObstruction \
            InfoGeometry.Canonical.MaurerCartanCurvature \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/foundations.log
      - name: Build Clifford tensor, operator, and family compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/freed-pin-compatibility/check.py build \
            InfoGeometry.Clifford.Cl11GradedTensorMorita \
            InfoGeometry.Geometry.KleinPinGradedDirac \
            InfoGeometry.Clifford.FreedKleinRepresentation \
            InfoGeometry.KK.PinFredholmTransport \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/compatibility.log
      - name: Build concrete Klein Morita and Pin frame compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/freed-pin-compatibility/check.py build \
            InfoGeometry.Geometry.KleinPinSmoothMorita \
            InfoGeometry.Geometry.KleinPinFrameFamily \
            InfoGeometry.KK.FreedPinAnalyticCompatibility \
            InfoGeometry.Geometry.KleinPinMoritaFamily \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/concrete-compatibility.log
      - name: Build compatibility with the actual Clifford tower
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/freed-pin-compatibility/check.py build \
            InfoGeometry.Canonical.SplitCliffordHeadMorita \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/tower.log
      - name: Audit every owned declaration in the complete focused closure
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/freed-pin-compatibility/check.py build \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/build.log
          python3 verification/freed-pin-compatibility/check.py env lean \
            -DwarningAsError=true \
            "$GITHUB_WORKSPACE/lean/InfoGeometry/Clifford/FreedPinCompatibilityAudit.lean" \
            2>&1 | tee verification/freed-pin-compatibility/artifacts/axioms.log
      - name: Record the source tree and toolchain
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('.')
          audit = root / 'lean/InfoGeometry/Clifford/FreedPinCompatibilityAudit.lean'
          modules = []
          for line in audit.read_text().replace('«', '').replace('»', '').splitlines():
              if line.startswith('import InfoGeometry.'):
                  modules.append(line.split()[1])
          paths = [root / 'lean' / (m.replace('.', '/') + '.lean') for m in modules]
          report = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'toolchain': Path('lean-toolchain').read_text().strip(),
              'owners': modules,
              'source_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
              'scope': 'Focused owners and full import closure; root acceptance remains separate',
          }
          output = Path('verification/freed-pin-compatibility/artifacts')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source-evidence.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freed-pin-compatibility-evidence
          path: verification/freed-pin-compatibility/artifacts/*
          if-no-files-found: warn
