      - 'lean/InfoGeometry/Singular/Drazin.lean'
      - 'lean/InfoGeometry/Singular/MetricAlgebraicProjectionDefect.lean'
      - 'lean/InfoGeometry/Singular/MoorePenroseSectors.lean'
      - 'lean/DAG/Basic.lean'
      - 'lean/InfoGeometry/Meta/Architecture.lean'
      - 'lean/InfoGeometry/Canonical/Drazin.lean'
      - 'lean/InfoGeometry/Singular/SquareZeroMoorePenrose.lean'
      - 'lean/InfoGeometry/Core/JordanPeirceDecomposition.lean'
      - 'lean/InfoGeometry/Core/JordanAssociatorRing.lean'
      - 'lean/InfoGeometry/Core/JordanAssociator.lean'
      - 'lean/InfoGeometry/Core/IdempotentSymmetricOverlap.lean'
      - 'lean/InfoGeometry/Singular/MoorePenroseChiralDefects.lean'
      - 'lean/InfoGeometry/Singular/SquareZeroChiralHodge.lean'
      - 'lean/InfoGeometry/Core/DiracSuperalgebra.lean'
      - 'lean/InfoGeometry/Core/PeirceTangent.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/MatrixOperatorIdentities.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/MatrixTraceGeometry.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceTraceGeometry.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceChiralGeometry.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/MatrixBlackHolePeirceD63.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/BlackHoleFiniteQuantum.lean'
      - 'lean/InfoGeometry/Probability/AitchisonFinite.lean'
      - 'lean/InfoGeometry/Quantum/FinitePartialTrace.lean'
      - 'lean/InfoGeometry/Quantum/FiniteAttentionCanonicalBridges.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/BlackHoleFiniteMarginal.lean'
      - 'lean/InfoGeometry/Quantum/ReplacementStateChannel.lean'
      - 'lean/InfoGeometry/Quantum/ProjectiveCoarseGraining.lean'
      - 'lean/InfoGeometry/Canonical/TwoSheetProjectiveCoarseGraining.lean'
      - 'tools/quality/check_clifford_dirac.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/placeholder_audit.py'
      - 'tools/quality/semantic_vacuity_gate.py'
      - 'tools/quality/semantic_vacuity_patterns.json'
      - 'tools/quality/audit_constructivity.py'
      - 'tools/quality/common.py'
      - 'tools/pathing.py'
      - 'tools/__init__.py'
      - 'tools/quality/__init__.py'
      - 'tools/build_lock.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/two-sheet-observational-entropy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-sheet-observational-entropy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENTROPY_TARGETS: '["InfoGeometry.Canonical.TwoSheetObservationalEntropy", "InfoGeometry.Canonical.TwoSheetProjectiveCoarseGraining"]'
    steps:
      - name: Fetch exact source without submodule traversal
        shell: bash
        env:
          SOURCE_REV: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          git init project
          git -C project remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C project fetch --depth=1 origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
      - name: Read exact dependency pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('project/lake-manifest.json').read_text())
          revision = next(p['rev'] for p in manifest['packages'] if p['name'] == 'mathlib')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mathlib={revision}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.pins.outputs.mathlib }}
          path: mathlib
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mathlib/.lake
          key: two-sheet-observational-entropy-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Fetch the pinned native import cache
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('project').resolve()))
          from tools.build_lock import BuildLock, DEFAULT_BUILD_LOCK_PATH
          from tools.quality.check_reviewed_prs import closure
          targets = json.loads(os.environ['ENTROPY_TARGETS'])
          _, _, native = closure(Path('project'), targets)
          with BuildLock(DEFAULT_BUILD_LOCK_PATH, 'two-sheet-observational-entropy-cache') as lock:
              subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(native)],
                  cwd='mathlib', check=True, pass_fds=(lock.fileno(),))
          PY
      - name: Check source closure, declaration axioms, and warnings
        working-directory: project
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          targets = json.loads(os.environ['ENTROPY_TARGETS'])
          cmd = ['python3', 'tools/quality/check_clifford_dirac.py',
                 '--mathlib-root', '../mathlib', '--output', '../two-sheet-observational-entropy-report']
          for target in targets:
              cmd += ['--target', target]
          subprocess.run(cmd, check=True)
          report = json.loads(pathlib.Path('../two-sheet-observational-entropy-report/report.json').read_text())
          assert report['status'] == 'passed' and report['audit_required']
          checked = {m['module']: m for m in report['modules']}
          assert all(t in checked and checked[t]['warnings'] == 0 for t in targets)
          paths = ['lean/' + t.replace('.', '/') + '.lean' for t in targets]
          for path in paths:
              subprocess.run(['python3', 'tools/quality/placeholder_audit.py',
                              '--root', path, '--strict'], check=True)
          subprocess.run(['python3', 'tools/quality/semantic_vacuity_gate.py',
                          *paths, '--fail-on', 'error'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-sheet-observational-entropy-evidence
          path: |
            two-sheet-observational-entropy-report/report.json
            two-sheet-observational-entropy-report/evidence-sha256.json
            two-sheet-observational-entropy-report/src
            two-sheet-observational-entropy-report/*.log
          if-no-files-found: warn
