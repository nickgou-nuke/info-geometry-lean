permissions:
  contents: read

concurrency:
  group: real-dirac-casimir-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # This public source checkout avoids recursive submodule auth cleanup.
      # github.sha preserves pull-request merge-commit verification.
      - name: Fetch and verify the exact source commit
        shell: bash
        env:
          SOURCE_REV: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test ! -e project
          git init project
          git -C project remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C project fetch --no-tags --depth=1 origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
          actual_rev="$(git -C project rev-parse HEAD)"
          if [ "$actual_rev" != "$SOURCE_REV" ]; then
            echo 'Source checkout differs from the requested workflow commit' >&2
            exit 1
          fi
      - name: Read exact dependency pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('project/lake-manifest.json').read_text())
          revision = next(p['rev'] for p in manifest['packages'] if p['name'] == 'mathlib')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mathlib={revision}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.pins.outputs.mathlib }}
          path: mathlib
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mathlib/.lake
          key: real-dirac-casimir-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Fetch the pinned native import cache
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('project').resolve()))
          from tools.build_lock import BuildLock, DEFAULT_BUILD_LOCK_PATH
          from tools.quality.check_reviewed_prs import closure
          targets = [
              'InfoGeometry.Canonical.HestenesNativeDiracCurrent',
              'InfoGeometry.Thermo.BilinearMetriplecticReduction',
              'InfoGeometry.Clifford.Cl55MetriplecticReduction',
          ]
          _, _, native = closure(Path('project'), targets)
          with BuildLock(DEFAULT_BUILD_LOCK_PATH, 'real-dirac-casimir-cache') as lock:
              subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(native)],
                  cwd='mathlib', check=True, pass_fds=(lock.fileno(),))
          PY
      - name: Compile selected source closure and audit every owned declaration
        working-directory: project
        run: |
          python3 tools/quality/check_clifford_dirac.py \
            --mathlib-root ../mathlib --output ../real-dirac-casimir-report \
            --target InfoGeometry.Canonical.HestenesNativeDiracCurrent \
            --target InfoGeometry.Thermo.BilinearMetriplecticReduction \
            --target InfoGeometry.Clifford.Cl55MetriplecticReduction
      - name: Require warning-free selected owners
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('real-dirac-casimir-report/report.json').read_text())
          assert report['status'] == 'passed', report['status']
          selected = set(report['targets'])
          rows = [row for row in report['modules'] if row['module'] in selected]
          assert {row['module'] for row in rows} == selected
          assert all(row['returncode'] == 0 and row['warnings'] == 0 for row in rows), rows
          PY
      - name: Check selected semantic content
        working-directory: project
        run: |
          python3 tools/quality/semantic_content_audit.py \
            --module-prefix InfoGeometry.Canonical.HestenesNativeDiracCurrent \
            --module-prefix InfoGeometry.Thermo.BilinearMetriplecticReduction \
            --module-prefix InfoGeometry.Clifford.Cl55MetriplecticReduction \
            --include-review --gate \
            --json-out ../real-dirac-casimir-report/semantic-content.json \
            --md-out ../real-dirac-casimir-report/semantic-content.md
      - name: Preserve native verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dirac-casimir-kernel-evidence
          path: |
            real-dirac-casimir-report/report.json
            real-dirac-casimir-report/evidence-sha256.json
            real-dirac-casimir-report/src/CliffordDiracAudit.lean
            real-dirac-casimir-report/*.log
            real-dirac-casimir-report/semantic-content.*
          if-no-files-found: warn
