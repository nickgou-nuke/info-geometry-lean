# ⚗️ NEMOCLAW CONFIGURATION: The Local Spire Runtime
# Configuration for the Local Multi-Agent Collective (NemoClaw + ClawCode + OpenClaw)

version: "1.1"
agent:
  name: "Nemo-ClawCode-Caretaker"
  orchestrator: "openclaw" 

  # The Discovery Engine (The Hands): Powered by Nous Hermes + Ollama
  discovery_engine:
    provider: "custom"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model: "hermes-3-llama-3.1-8b" # or qwen2.5:14b as suggested
    config_path: "./tools/infra/hermes_config.yaml"

  # The Logic Engine (The Logos): Powered by NVIDIA Nemotron-70B
  logic_engine:
    provider: "nvidia"
    model: "nvidia/llama-3.1-nemotron-70b-instruct" 
    base_url: "http://localhost:8000/v1" 

  # The Verification Kernel
  code_engine:
    provider: "clawcode"
    integrated_tools:
      - "lean4-compiler"
      - "semantic-audit"
      - "dag-doctor"

# Security: NVIDIA OpenShell Sandbox
sandbox:
  enabled: true
  provider: "openshell"
  allowed_directories:
    - "./lean"
    - "./docs"
    - "./quarantine"
    - "./skills"
