name: Real BKM and associator kernel check

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Canonical/KuboMoriBogoliubovMetric.lean'
