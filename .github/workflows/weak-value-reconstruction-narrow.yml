name: Weak Value Reconstruction Narrow Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'lean/InfoGeometry/Krein/TransitionWeakValue*.lean'
      - 'lean/InfoGeometry/Canonical/WeakValuePoleBounds.lean'
      - '.github/workflows/weak-value-reconstruction-narrow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weak-value-reconstruction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Install elan without changing the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Record compiler and check exclusive workspace
        shell: bash
        run: |
          set -euo pipefail
          cat lean-toolchain
          lean --version
          if pgrep -x lean || pgrep -x lake; then
            echo 'Unexpected active compiler in this runner workspace.'
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-weak-readout-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-weak-readout-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Fetch the existing Mathlib cache (no lake update)
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          git diff --exit-code -- lean-toolchain lake-manifest.json lakefile.lean
      - name: Build only the focused owner closure under the repository lock
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/infra/run_locked_lake_build.py --wait-for-build-lock InfoGeometry.Krein.TransitionWeakValueAudit
      - name: Print and inspect axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean lean/InfoGeometry/Krein/TransitionWeakValueAudit.lean 2>&1 | tee weak-value-axioms.log
          if grep -q 'sorryAx' weak-value-axioms.log; then
            echo 'Unresolved proof found in the focused axiom closure.'
            exit 1
          fi
          git diff --exit-code -- lean-toolchain lake-manifest.json lakefile.lean
      - name: Preserve the axiom check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weak-value-reconstruction-axioms
          path: weak-value-axioms.log
          if-no-files-found: ignore
