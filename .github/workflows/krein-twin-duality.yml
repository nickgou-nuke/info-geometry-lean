name: Krein twin duality kernel check

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Epistemology/RiemannianSubmersion.lean'
      - 'lean/InfoGeometry/Algebra/ChakravalaGA.lean'
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Canonical/UHFInductiveColimitBoundary.lean'
      - 'lean/InfoGeometry/Canonical/SuperGrassmannianManifold.lean'
      - 'lean/InfoGeometry/Canonical/NaturalGradientSubmersionFlow.lean'
      - 'lean/InfoGeometry/QuantumContext/MatrixGNS.lean'
      - 'lean/InfoGeometry/Export/LeanOracle.lean'
      - 'lean/InfoGeometry/Export/LeanJuliaVerifiedInterop.lean'
      - 'lean/InfoGeometry/Epistemology/SubmersionSplitFinrank.lean'
      - 'lean/InfoGeometry/Algebra/HodgeGeometricCalculus.lean'
      - 'lean/InfoGeometry/Canonical/TensorTowerColimit.lean'
      - 'lean/InfoGeometry/Canonical/HolographicColimitContinuum.lean'
      - 'lean/InfoGeometry/Epistemology/VariationalRG.lean'
      - 'lean/InfoGeometry/Epistemology/ChentsovMetricInvariance.lean'
      - 'lean/InfoGeometry/Canonical/GrandEpistemicGeometricSynthesis.lean'
      - 'lean/InfoGeometry/Canonical/ParaKahlerLagrangianDimension.lean'
      - 'lean/InfoGeometry/Krein/ExchangedProjectionPairing.lean'
      - 'lean/InfoGeometry/Core/IdempotencyDefect.lean'
      - 'lean/InfoGeometry/Core/PeirceDecomposition.lean'
      - 'lean/InfoGeometry/Core/PeirceMatrixTracePairing.lean'
      - 'lean/InfoGeometry/Physics/KreinDiracKasparovSpinorBilinear.lean'
      - 'lean/InfoGeometry/CliffordWeyl/DiracPeircePairing.lean'
      - 'lean/InfoGeometry/Algebra/IdempotentCornerCommutant.lean'
      - 'lean/InfoGeometry/CliffordWeyl/KreinTwinIdealPairing.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/GradeActionInterface.lean'
      - 'lean/InfoGeometry/Canonical/RealDoubledKreinMirror.lean'
      - 'lean/InfoGeometry/Canonical/RealMirrorComplexStructure.lean'
      - 'lean/InfoGeometry/Canonical/HestenesPhaseBoostRotors.lean'
      - 'lean/InfoGeometry/Canonical/RealComplexRotor.lean'
      - 'lean/InfoGeometry/Canonical/HestenesLoxodromicRotor.lean'
      - 'lean/InfoGeometry/Krein/LoxodromicPairingFlow.lean'
      - 'tools/quality/check_clifford_dirac.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/build_lock.py'
      - 'tools/quality/placeholder_audit.py'
      - 'tools/quality/semantic_vacuity_gate.py'
      - 'tools/quality/semantic_vacuity_patterns.json'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/krein-twin-duality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krein-twin-duality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact public source without traversing external submodules
        shell: bash
        env:
          SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git init project
          git -C project remote add origin "${GITHUB_SERVER_URL}/${SOURCE_REPOSITORY}.git"
          git -C project fetch --no-tags --no-recurse-submodules --depth=1 origin "$SOURCE_REV"
          git -C project -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git -C project rev-parse HEAD)" = "$SOURCE_REV"
      - name: Read exact dependency pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PINS'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('project/lake-manifest.json').read_text())
          revision = next(p['rev'] for p in manifest['packages'] if p['name'] == 'mathlib')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mathlib={revision}\n')
          PINS
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.pins.outputs.mathlib }}
          path: mathlib
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mathlib/.lake
          key: krein-twin-duality-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Fetch the pinned native import cache
        shell: bash
        run: |
          python3 - <<'CACHE'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('project').resolve()))
          from tools.build_lock import BuildLock, DEFAULT_BUILD_LOCK_PATH
          from tools.quality.check_reviewed_prs import closure
          targets = [
              'InfoGeometry.Krein.ExchangedProjectionPairing',
              'InfoGeometry.CliffordWeyl.KreinTwinIdealPairing',
              'InfoGeometry.Krein.LoxodromicPairingFlow',
          ]
          _, _, native = closure(Path('project'), targets)
          with BuildLock(DEFAULT_BUILD_LOCK_PATH, 'twin-native-cache') as lock:
              subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(native)],
                  cwd='mathlib', check=True, pass_fds=(lock.fileno(),))
          CACHE
      - name: Check exact source closure and all target declarations
        working-directory: project
        shell: bash
        run: |
          python3 tools/quality/check_clifford_dirac.py \
            --mathlib-root ../mathlib --output ../twin-report \
            --target InfoGeometry.Krein.ExchangedProjectionPairing \
            --target InfoGeometry.CliffordWeyl.KreinTwinIdealPairing \
            --target InfoGeometry.Krein.LoxodromicPairingFlow
          python3 - <<'REPORT'
          import json
          from pathlib import Path
          report = json.loads(Path('../twin-report/report.json').read_text())
          assert report['status'] == 'passed', report
          selected = [m for m in report['modules'] if m['module'] in report['targets']]
          assert len(selected) == len(report['targets'])
          assert all(m['returncode'] == 0 and m['warnings'] == 0 for m in selected), selected
          REPORT
      - name: Check placeholders and semantic vacuity
        working-directory: project
        shell: bash
        run: |
          python3 - <<'SOURCE'
          import subprocess
          files = [
              'lean/InfoGeometry/Krein/ExchangedProjectionPairing.lean',
              'lean/InfoGeometry/CliffordWeyl/KreinTwinIdealPairing.lean',
              'lean/InfoGeometry/Krein/LoxodromicPairingFlow.lean',
          ]
          for path in files:
              subprocess.run(['python3', 'tools/quality/placeholder_audit.py',
                  '--root', path, '--strict'], check=True)
          subprocess.run(['python3', 'tools/quality/semantic_vacuity_gate.py',
              *files, '--fail-on', 'error', '--json-out',
              '../twin-report/semantic.json'], check=True)
          SOURCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krein-twin-duality-evidence
          path: |
            twin-report/report.json
            twin-report/evidence-sha256.json
            twin-report/src/CliffordDiracAudit.lean
            twin-report/*.log
            twin-report/semantic.json
          if-no-files-found: warn
