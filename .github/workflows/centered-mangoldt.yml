name: Centered Mangoldt bridge

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Arithmetic/RiemannHypothesisHalfPlaneReduction*.lean'
      - 'lean/InfoGeometry/Arithmetic/FiniteSmoothedMangoldt*.lean'
      - 'lean/InfoGeometry/Arithmetic/SmoothedMangoldt*.lean'
      - 'lean/InfoGeometry/Arithmetic/CenteredMangoldtBridgeAudit.lean'
      - 'lean/InfoGeometry/Analysis/CenteredLogInterpolation.lean'
      - 'lean/InfoGeometry/Arithmetic/PrimeDistributionLaw.lean'
      - 'lean/InfoGeometry/Arithmetic/ActualRiemannZetaVonMangoldtBridge.lean'
      - 'lean/InfoGeometry/Arithmetic/RiemannZetaFiniteFacts.lean'
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'verification/centered-mangoldt/**'
      - 'verification/real-matrix-split/audit.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'tools/build_lock.py'
      - 'tools/infra/build.py'
      - 'tools/pathing.py'
      - '.github/workflows/centered-mangoldt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centered-mangoldt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Record checked revision
        run: |
          git rev-parse HEAD > centered-mangoldt-revision.log
          git rev-parse 'HEAD^{tree}' >> centered-mangoldt-revision.log
      - name: Restore pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: centered-mangoldt-deps-lean4341-d13f23b7-${{ runner.os }}-v1
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1
      - name: Retrieve pinned Mathlib artifacts
        run: python3 verification/centered-mangoldt/check.py exe cache get
      - name: Check source inventory and dependency pins
        run: python3 verification/centered-mangoldt/audit.py
      - name: Compile the owner and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/centered-mangoldt/check.py --wfail build 2>&1 | tee centered-mangoldt-build.log
      - name: Check fresh axiom reports
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/centered-mangoldt/check.py env lean -DwarningAsError=true lean/InfoGeometry/Arithmetic/CenteredMangoldtBridgeAudit.lean 2>&1 | tee centered-mangoldt-axioms.log
          python3 verification/centered-mangoldt/audit.py --log centered-mangoldt-axioms.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centered-mangoldt-validation
          path: |
            centered-mangoldt-revision.log
            centered-mangoldt-build.log
            centered-mangoldt-axioms.log
