name: G2 Artin Longest Bridge Narrow Check

on:
  push:
    branches:
      - agent/g2-artin-longest-bridge
    paths:
      - "lean/InfoGeometry/Exceptional/G2ArtinLongestBridge.lean"
      - ".github/workflows/g2-artin-longest-narrow.yml"
  pull_request:
    paths:
      - "lean/InfoGeometry/Exceptional/G2ArtinLongestBridge.lean"
      - ".github/workflows/g2-artin-longest-narrow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrow-g2-artin-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build focused owner in isolated Mathlib project
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/g2-artin-longest-check"
          mkdir -p "$work"
          cd "$work"
          cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain
          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL
          package g2ArtinLongestCheck
          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.28.1"
          @[default_target]
          lean_lib InfoGeometry
          EOF
          ln -s "$GITHUB_WORKSPACE/lean/InfoGeometry" InfoGeometry
          lake update
          lake exe cache get
          lake build InfoGeometry.Exceptional.G2ArtinLongestBridge
