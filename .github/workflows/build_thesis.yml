name: Build thesis, blueprint, and docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Lean + Blueprint + API docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git graphviz \
            latexmk biber \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-plain-generic

      - name: Install Lean toolchain (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ~/.elan/bin/elan --version
          ~/.elan/bin/lake --version

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install leanblueprint

      - name: Build Lean project
        run: |
          lake build

      - name: Extract LeanArchitect blueprint
        run: |
          lake build :blueprint

      - name: Export Lean declarations inventory
        run: |
          lake env lean --run scripts/ExportDecls.lean InfoGeometry InfoGeometry docs-map/declarations.json

      - name: Build docs crosswalk and coverage
        run: |
          python3 -m scripts build-doc-map --strict
          python3 scripts/emit_blueprint_tex.py    # still Lean code, keep as-is
          python3 -m scripts emit-markdown-index

      - name: Validate blueprint declaration references
        run: |
          leanblueprint checkdecls

      - name: Build blueprint web + PDF
        run: |
          leanblueprint pdf
          leanblueprint web

      - name: Build doc-gen4 API docs
        run: |
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update doc-gen4
          lake update InfoGeometry
          lake build InfoGeometry:docs

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site

          if [ -d "blueprint/web" ]; then
            cp -r blueprint/web _site/blueprint
          else
            echo "Expected blueprint/web not found"
            exit 1
          fi

          if [ -d "docbuild/.lake/build/doc" ]; then
            cp -r docbuild/.lake/build/doc _site/docs
          else
            echo "Expected docbuild/.lake/build/doc not found"
            exit 1
          fi

          for p in blueprint/print/print.pdf blueprint/print.pdf blueprint.pdf; do
            if [ -f "$p" ]; then
              cp "$p" _site/blueprint.pdf
              break
            fi
          done

          mkdir -p _site/meta
          cp -r docs-map _site/meta/docs-map
          if [ -d "docs/auto" ]; then
            mkdir -p _site/docs-auto
            cp -r docs/auto/* _site/docs-auto/ || true
          fi

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>InfoGeometry Build Artifacts</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
              code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 4px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
              .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; }
              a { text-decoration: none; }
            </style>
          </head>
          <body>
            <h1>InfoGeometry artifacts</h1>
            <p>This site is generated by GitHub Actions from the Lean formalization repository.</p>
            <div class="grid">
              <div class="card">
                <h2>Blueprint web</h2>
                <p>Interactive dependency graph and thesis narrative.</p>
                <p><a href="./blueprint/">Open blueprint</a></p>
              </div>
              <div class="card">
                <h2>API docs</h2>
                <p><code>doc-gen4</code> generated documentation for the Lean code.</p>
                <p><a href="./docs/">Open API docs</a></p>
              </div>
              <div class="card">
                <h2>Blueprint PDF</h2>
                <p>Printable thesis blueprint build.</p>
                <p><a href="./blueprint.pdf">Open PDF</a></p>
              </div>
              <div class="card">
                <h2>Crosswalk reports</h2>
                <p>Generated manifest resolution and coverage reports.</p>
                <p><a href="./meta/docs-map/">Open reports</a></p>
              </div>
            </div>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload build reports (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: infogeometry-build-reports
          path: |
            docs-map/declarations.json
            docs-map/resolved.json
            docs-map/coverage.json
            docs/auto/index.md
            blueprint/web
            blueprint/print/print.pdf
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
