name: Chiral trace proofs
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/NCG/ChiralMatrixTrace.lean'
      - 'lean/InfoGeometry/NCG/PartialPhaseLocalization.lean'
      - 'lean/InfoGeometry/NCG/ChiralTraceAudit.lean'
      - 'scripts/quality/check-chiral-trace.sh'
      - '.github/workflows/chiral-trace.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chiral-trace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
          key: rectangular-proof-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check matrix proofs and inspect axioms
        run: bash scripts/quality/check-chiral-trace.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiral-trace-proof-logs
          path: .artifacts/chiral-trace
