name: Agent Amari Zorn Lean Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/amari-zorn-commutator-bridge]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Create isolated native Mathlib project
        run: |
          rm -rf .agent-validate
          mkdir .agent-validate
          ln -s ../lean .agent-validate/lean
          cat > .agent-validate/lean-toolchain <<'EOF'
          leanprover/lean4:v4.28.1
          EOF
          cat > .agent-validate/lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package amariZornValidation where
            srcDir := "lean"

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.28.1"

          lean_lib InfoGeometry where
            globs := #[.andSubmodules `InfoGeometry]
          EOF
      - name: Resolve Mathlib and fetch native cache
        working-directory: .agent-validate
        run: |
          lake update
          lake exe cache get
      - name: Compile RegularActionAssociator
        working-directory: .agent-validate
        run: lake build InfoGeometry.Algebra.Zorn.RegularActionAssociator
      - name: Compile DualFlatCurvature
        working-directory: .agent-validate
        run: lake build InfoGeometry.Geometry.Statistical.DualFlatCurvature
      - name: Compile AmariZornRegularActionBridge
        working-directory: .agent-validate
        run: lake build InfoGeometry.Bridge.AmariZornRegularActionBridge
      - name: Compile AmariZornDerivationBridge
        working-directory: .agent-validate
        run: lake build InfoGeometry.Bridge.AmariZornDerivationBridge
      - name: Reject placeholders in new modules
        run: |
          if grep -RInE '\b(sorry|admit)\b' \
            lean/InfoGeometry/Algebra/Zorn/RegularActionAssociator.lean \
            lean/InfoGeometry/Geometry/Statistical/DualFlatCurvature.lean \
            lean/InfoGeometry/Bridge/AmariZornRegularActionBridge.lean \
            lean/InfoGeometry/Bridge/AmariZornDerivationBridge.lean; then
            exit 1
          fi
