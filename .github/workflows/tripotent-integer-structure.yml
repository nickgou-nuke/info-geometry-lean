name: Tripotent integer structure (scoped)
on:
  pull_request:
    paths:
      - 'lean/**'
      - 'tools/quality/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/tripotent-integer-structure.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tripotent-integer-structure-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact source and pinned Mathlib
        shell: bash
        env:
          SOURCE_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init project
          git -C project remote add origin "https://github.com/${{ github.repository }}.git"
          git -C project fetch --depth=1 origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('project')
          spec = json.loads((root / 'lake-manifest.json').read_text())
          pin = next(p for p in spec['packages'] if p['name'] == 'mathlib')
          subprocess.run(['git', 'init', 'pinned-mathlib'], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'remote', 'add', 'origin', pin['url']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'fetch', '--depth=1', 'origin', pin['rev']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Check exact source integrity
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          from tools.quality.check_tripotent_integer_structure import TARGETS
          from tools.quality.proof_proxy_staged_gate import ActiveIndexCache, check_text
          root = pathlib.Path.cwd()
          files = ['lean/' + m.replace('.', '/') + '.lean' for m in TARGETS]
          index = ActiveIndexCache(root)
          failures = []
          for path in files:
              failures.extend(check_text(path, (root / path).read_text(), root, index_cache=index))
          if not index.still_current():
              failures.append('Git index changed during source-integrity check')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Canonical proof-integrity checks passed for every selected owner')
          subprocess.run(['python3', 'tools/infra/opengauss_screener.py', *files, '--strict'], check=True)
          subprocess.run(['python3', 'tools/infra/opengauss_cli.py', 'refute', *files, '--strict'], check=True)
          for path in files:
              subprocess.run(['python3', 'tools/scripts/vacuity-linter.py', path, '--json'], check=True)
          PY
      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Compile exact source closure and audit owned declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tools/quality/check_tripotent_integer_structure.py \
            --mathlib-root pinned-mathlib --output verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripotent-integer-structure-verification
          path: |
            verification/**/*.log
            verification/**/*.json
            verification/**/*.txt
            verification/src
