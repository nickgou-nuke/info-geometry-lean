name: Sorry Gate
on: [push, pull_request]
jobs:
  sorry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/infra/run_locked_lake_build.py --wait-for-build-lock --all-default-targets
      - name: Repository-wide Lean debt audit
        run: |
          python3 tools/quality/repo_lean_scope_audit.py --fail-on tracked
          python3 tools/quality/repo_lean_quarantine_audit.py --fail-on-findings
