name: Real Krein Peirce sections and differential on the Klein cover

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Core/IdempotencyDefect.lean'
      - 'lean/InfoGeometry/Core/PeirceDecomposition.lean'
      - 'lean/InfoGeometry/Core/PeirceGrading.lean'
      - 'lean/InfoGeometry/Core/PeirceStarCharges.lean'
      - 'lean/InfoGeometry/Core/PeirceCoupledCorners.lean'
      - 'lean/InfoGeometry/Canonical/LieJordanSandwichGeometry.lean'
      - 'lean/InfoGeometry/Core/PeirceSandwichDuality.lean'
      - 'lean/InfoGeometry/Core/PeirceStarNaturality.lean'
      - 'lean/InfoGeometry/Core/PeirceSheetExchange.lean'
      - 'lean/InfoGeometry/Topology/ContinuousPeirceSections.lean'
      - 'lean/InfoGeometry/Topology/KleinBrillouinBase.lean'
      - 'lean/InfoGeometry/Topology/KleinBottleOrbitQuotient.lean'
      - 'lean/InfoGeometry/Topology/KleinGlideCovering.lean'
      - 'lean/InfoGeometry/GrandUnification/ArchetypeDictionary.lean'
      - 'lean/InfoGeometry/Krein/KreinSpace.lean'
      - 'lean/InfoGeometry/Cartan/Involution.lean'
      - 'lean/InfoGeometry/Krein/InvolutiveSelfDualCarrier.lean'
      - 'lean/InfoGeometry/Krein/DoubledSpace.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/RealDoubledChiralKrein.lean'
      - 'lean/InfoGeometry/Krein/DiracHodgeDoubledSpace.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/RealDoubledChiralKreinAdjoint.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/RealDoubledChiralKreinComplements.lean'
      - 'lean/InfoGeometry/Carrier/HestenesKrein.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/RealDoubledChiralKreinCarrier.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/RealDoubledChiralKreinReal.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/RealDoubledChiralKreinNative.lean'
      - 'lean/InfoGeometry/Topology/KleinRealKreinPeirceSections.lean'
      - 'lean/InfoGeometry/Core/IdempotentCartan.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/LieJordanEndomorphisms.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/LieJordanBoundaryComposition.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceTwistedComplex.lean'
      - 'lean/InfoGeometry/Topology/KleinPeirceDifferential.lean'
      - 'tools/quality/check_clifford_dirac.py'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/semantic_vacuity_gate.py'
      - 'tools/quality/semantic_vacuity_patterns.json'
      - 'tools/build_lock.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/klein-real-krein-peirce-sections.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klein-real-krein-peirce-sections-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PEIRCE_TARGETS: >-
        InfoGeometry.Core.PeirceSheetExchange
        InfoGeometry.Topology.ContinuousPeirceSections
        InfoGeometry.Topology.KleinRealKreinPeirceSections
        InfoGeometry.Topology.KleinPeirceDifferential
    steps:
      - name: Fetch exact public source without traversing external submodules
        shell: bash
        env:
          SOURCE_REV: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init project
          git -C project remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C project -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
      - name: Read exact Mathlib revision
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('project/lake-manifest.json').read_text())
          revision = next(p['rev'] for p in manifest['packages'] if p['name'] == 'mathlib')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mathlib={revision}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.pins.outputs.mathlib }}
          path: mathlib
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mathlib/.lake
          key: klein-real-krein-peirce-sections-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Hydrate exact native imports under the build lock
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('project').resolve()))
          from tools.build_lock import BuildLock, DEFAULT_BUILD_LOCK_PATH
          from tools.quality.check_reviewed_prs import closure
          _, _, native = closure(Path('project'), os.environ['PEIRCE_TARGETS'].split())
          with BuildLock(DEFAULT_BUILD_LOCK_PATH, 'klein-peirce-cache') as lock:
              subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(native)],
                  cwd='mathlib', check=True, pass_fds=(lock.fileno(),))
          PY
      - name: Compile exact source closure and audit every new declaration
        run: |
          python3 - <<'PY'
          import os, subprocess
          targets = os.environ['PEIRCE_TARGETS'].split()
          command = ['python3', 'project/tools/quality/check_clifford_dirac.py',
              '--mathlib-root', 'mathlib', '--output', 'klein-peirce-report']
          for target in targets:
              command.extend(['--target', target])
          subprocess.run(command, check=True)
          PY
      - name: Require zero warnings in every new owner
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('klein-peirce-report/report.json').read_text())
          targets = os.environ['PEIRCE_TARGETS'].split()
          assert report['status'] == 'passed' and report['audit_required']
          assert report['targets'] == targets
          modules = {row['module']: row for row in report['modules']}
          for target in targets:
              row = modules[target]
              assert row['returncode'] == 0 and row['warnings'] == 0 and not row['reused'], row
              assert report['declaration_counts'][target] > 0
          print('All selected owners compiled without warnings; transitive axiom audit passed.')
          PY
      - name: Screen the mathematical source
        working-directory: project
        run: |
          python3 tools/quality/semantic_vacuity_gate.py \
            lean/InfoGeometry/Core/PeirceSheetExchange.lean \
            lean/InfoGeometry/Topology/ContinuousPeirceSections.lean \
            lean/InfoGeometry/Topology/KleinRealKreinPeirceSections.lean \
            lean/InfoGeometry/Topology/KleinPeirceDifferential.lean --fail-on error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klein-real-krein-peirce-sections-evidence
          path: |
            klein-peirce-report/report.json
            klein-peirce-report/evidence-sha256.json
            klein-peirce-report/src/CliffordDiracAudit.lean
            klein-peirce-report/*.log
          if-no-files-found: warn
