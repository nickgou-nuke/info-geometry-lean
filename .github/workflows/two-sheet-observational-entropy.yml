      - 'lean/InfoGeometry/Canonical/Cuntz2Isometries.lean'
      - 'lean/InfoGeometry/Canonical/ChiralCuntzSuperchargeBridge.lean'
      - 'lean/InfoGeometry/Canonical/ChiralApollonianCylinderBridge.lean'
      - 'lean/InfoGeometry/Canonical/ChiralCuntzAnomalyPartitionBridge.lean'
      - 'lean/InfoGeometry/Meta/ArchetypePipeline.lean'
