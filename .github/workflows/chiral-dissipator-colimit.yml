name: Chiral dissipator colimit proofs
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/OperatorAlgebra/SymmetricDissipator.lean'
      - 'lean/InfoGeometry/Canonical/SymmetricDissipator*.lean'
      - 'scripts/quality/check-chiral-dissipator-colimit.py'
      - '.github/workflows/chiral-dissipator-colimit.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chiral-dissipator-colimit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
          key: rectangular-proof-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Install pinned Lean toolchain
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --connect-timeout 15 --max-time 60 --retry 2 -sSf \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o "$RUNNER_TEMP/elan-init.sh"
            timeout 120 sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          timeout 600 "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check matrix proofs and inspect axioms
        run: python3 scripts/quality/check-chiral-dissipator-colimit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiral-dissipator-colimit-proof-logs
          path: .artifacts/chiral-dissipator-colimit
