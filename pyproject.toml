[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infogeometry"
version = "0.1.0"
description = "Utility scripts and tools for the InfoGeometry Lean project"
authors = [ { name = "Project Authors" } ]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "jsonschema==4.23.0",
  "python-arango>=7.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
cas = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "clifford>=1.4",
  "ray>=2.9",
]
ontology = [
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
]


[project.scripts]
infogeometry = "scripts.cli:main"
igf = "igf.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["igf*", "cli*", "scripts*", "tools*"]
