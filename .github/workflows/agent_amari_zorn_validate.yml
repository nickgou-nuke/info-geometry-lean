name: Agent Amari Zorn Lean Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/amari-zorn-commutator-bridge]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Compile RegularActionAssociator
        run: lake env lean lean/InfoGeometry/Algebra/Zorn/RegularActionAssociator.lean
      - name: Compile DualFlatCurvature
        run: lake env lean lean/InfoGeometry/Geometry/Statistical/DualFlatCurvature.lean
      - name: Compile AmariZornRegularActionBridge
        run: lake env lean lean/InfoGeometry/Bridge/AmariZornRegularActionBridge.lean
      - name: Compile AmariZornDerivationBridge
        run: lake env lean lean/InfoGeometry/Bridge/AmariZornDerivationBridge.lean
      - name: Reject placeholders in new modules
        run: |
          if grep -RInE '\b(sorry|admit)\b' \
            lean/InfoGeometry/Algebra/Zorn/RegularActionAssociator.lean \
            lean/InfoGeometry/Geometry/Statistical/DualFlatCurvature.lean \
            lean/InfoGeometry/Bridge/AmariZornRegularActionBridge.lean \
            lean/InfoGeometry/Bridge/AmariZornDerivationBridge.lean; then
            exit 1
          fi
