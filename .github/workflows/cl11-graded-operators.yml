name: Clifford operators and gauge algebra kernel check

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Clifford/Cl11*.lean'
      - 'lean/InfoGeometry/Clifford/Cl22QuaternionCayley.lean'
      - 'lean/InfoGeometry/Algebra/UnitriangularBCH.lean'
      - 'lean/InfoGeometry/Quantum/OperatorWeylHolonomy.lean'
      - 'lean/InfoGeometry/LatticeGauge/FinitePlaquette.lean'
      - 'lean/InfoGeometry/Geometry/AssociativeGaugeConnection.lean'
      - 'lean/InfoGeometry/Canonical/CliffordHolonomyCurvature.lean'
      - 'lean/InfoGeometry/Clifford/JordanWigner*.lean'
      - 'lean/InfoGeometry/Clifford/TowerMatrix.lean'
      - 'lean/InfoGeometry/Clifford/SplitQ11.lean'
      - 'lean/InfoGeometry/Clifford/SplitAtomDoubling.lean'
      - 'lean/InfoGeometry/Clifford/SplitAtomDoubling/**'
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Algebra/MatrixNoncommutativity.lean'
      - 'lean/InfoGeometry/Algebra/TensorAlgebraCanonical.lean'
      - 'lean/InfoGeometry/Algebra/FiniteTensorDeterminantStabilization.lean'
      - 'lean/InfoGeometry/Algebra/InductiveSuperClosureLemmas.lean'
      - 'lean/InfoGeometry/Algebra/DirectLimitSuperClosureLemmas.lean'
      - 'lean/InfoGeometry/Canonical/Cl11TensorTower*.lean'
      - 'lean/InfoGeometry/Canonical/Cl55WittCAR.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/IntrinsicGradedAdjoint.lean'
      - 'tools/quality/check_clifford_dirac.py'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/placeholder_audit.py'
      - 'tools/quality/semantic_vacuity_gate.py'
      - 'tools/quality/semantic_vacuity_patterns.json'
      - 'tools/infra/opengauss_screener.py'
      - 'tools/build_lock.py'
      - 'docs/CLIFFORD_COLIMIT_GRADED_OPERATOR_BRIDGE.md'
      - 'docs/KLEIN_TWIST_GRADED_DOUBLING.md'
      - 'docs/CLIFFORD_HOLONOMY_CURVATURE_CONTRACT.md'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/cl11-graded-operators.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl11-graded-operators-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  kernel-and-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CL11_GRADED_TARGETS: >-
        ["InfoGeometry.Clifford.Cl11GradedOperatorAction",
        "InfoGeometry.Clifford.Cl11ColimitDimension",
        "InfoGeometry.Clifford.SplitAtomDoubling.Basic",
        "InfoGeometry.Clifford.Cl11KleinTwist",
        "InfoGeometry.Clifford.Cl11BrauerWeylGenerators",
        "InfoGeometry.Clifford.SplitAtomDoubling",
        "InfoGeometry.Algebra.UnitriangularBCH",
        "InfoGeometry.Quantum.OperatorWeylHolonomy",
        "InfoGeometry.Geometry.AssociativeGaugeConnection",
        "InfoGeometry.Clifford.Cl22QuaternionCayley",
        "InfoGeometry.Canonical.CliffordHolonomyCurvature"]
    steps:
      - name: Check out the exact public repository revision
        shell: bash
        run: |
          # No submodule initialization or credentials are needed for this source closure.
          # Direct checkout avoids traversal of unrelated unmapped upstream gitlinks.
          git init project
          git -C project remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C project -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C project checkout --detach FETCH_HEAD
          test "$(git -C project rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Read exact dependency pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('project/lake-manifest.json').read_text())
          revision = next(p['rev'] for p in manifest['packages'] if p['name'] == 'mathlib')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mathlib={revision}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.pins.outputs.mathlib }}
          path: mathlib
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mathlib/.lake
          key: cl11-graded-operators-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Fetch pinned native imports
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('project').resolve()))
          from tools.build_lock import BuildLock, DEFAULT_BUILD_LOCK_PATH
          from tools.quality.check_reviewed_prs import closure
          targets = json.loads(os.environ['CL11_GRADED_TARGETS'])
          _, _, native = closure(Path('project'), targets)
          with BuildLock(DEFAULT_BUILD_LOCK_PATH, 'cl11-graded-operators-cache') as lock:
              subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(native)],
                  cwd='mathlib', check=True, pass_fds=(lock.fileno(),))
          PY
      - name: Compile complete source closure and audit owned declarations
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          command = [sys.executable, 'tools/quality/check_clifford_dirac.py',
                     '--mathlib-root', '../mathlib', '--output', '../cl11-graded-report']
          for target in json.loads(os.environ['CL11_GRADED_TARGETS']):
              command.extend(['--target', target])
          subprocess.run(command, check=True)
          PY
      - name: Check placeholders, strict screening, and semantic findings
        working-directory: project
        shell: bash
        run: |
          python3 tools/quality/placeholder_audit.py --strict --root lean/InfoGeometry/Clifford/Cl11GradedOperatorAction.lean
          python3 tools/infra/opengauss_screener.py --strict lean/InfoGeometry/Clifford/Cl11GradedOperatorAction.lean
          python3 tools/quality/semantic_vacuity_gate.py lean/InfoGeometry/Clifford/Cl11GradedOperatorAction.lean --fail-on error --json-out ../cl11-graded-report/semantic-vacuity.json
          extension_owners=(
            lean/InfoGeometry/Clifford/SplitAtomDoubling/Basic.lean
            lean/InfoGeometry/Clifford/Cl11KleinTwist.lean
            lean/InfoGeometry/Clifford/Cl11BrauerWeylGenerators.lean
            lean/InfoGeometry/Clifford/SplitAtomDoubling.lean
            lean/InfoGeometry/Algebra/UnitriangularBCH.lean
            lean/InfoGeometry/Quantum/OperatorWeylHolonomy.lean
            lean/InfoGeometry/Geometry/AssociativeGaugeConnection.lean
            lean/InfoGeometry/Clifford/Cl22QuaternionCayley.lean
            lean/InfoGeometry/Canonical/CliffordHolonomyCurvature.lean
          )
          for owner in "${extension_owners[@]}"; do
            python3 tools/quality/placeholder_audit.py --strict --root "$owner"
            python3 tools/infra/opengauss_screener.py --strict "$owner"
          done
          python3 tools/quality/semantic_vacuity_gate.py "${extension_owners[@]}" --fail-on error --json-out ../cl11-graded-report/semantic-vacuity-klein.json
      - name: Reconcile scope and bind verification evidence
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('../cl11-graded-report')
          targets = json.loads(os.environ['CL11_GRADED_TARGETS'])
          report = json.loads((out / 'report.json').read_text())
          assert report['status'] == 'passed' and report['targets'] == targets
          assert report['audit_required']
          modules = {m['module']: m for m in report['modules']}
          assert len(modules) == len(report['modules'])
          assert all(m['returncode'] == 0 and not m['reused'] for m in modules.values())
          assert all(modules[t]['warnings'] == 0 for t in targets)
          assert set(report['declaration_counts']) == set(targets)
          assert all(report['declaration_counts'][t] > 0 for t in targets)
          for module, expected in report['source_sha256'].items():
              path = Path('lean') / (module.replace('.', '/') + '.lean')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, module
          semantic = json.loads((out / 'semantic-vacuity.json').read_text())
          owner = 'lean/InfoGeometry/Clifford/Cl11GradedOperatorAction.lean'
          assert semantic['coverage_complete'] and not semantic['read_failures']
          assert semantic['files_selected'] == semantic['files_scanned'] == 1
          for field in ['source_paths', 'successfully_read_paths', 'scope_roots']:
              assert semantic[field] == [owner], field
          assert semantic['fail_on'] == 'error' and not semantic['fail_prefixes']
          assert semantic['severity_counts'].get('error', 0) == 0
          klein = json.loads((out / 'semantic-vacuity-klein.json').read_text())
          extension_owners = {
              'lean/InfoGeometry/Clifford/SplitAtomDoubling/Basic.lean',
              'lean/InfoGeometry/Clifford/Cl11KleinTwist.lean',
              'lean/InfoGeometry/Clifford/Cl11BrauerWeylGenerators.lean',
              'lean/InfoGeometry/Clifford/SplitAtomDoubling.lean',
              'lean/InfoGeometry/Algebra/UnitriangularBCH.lean',
              'lean/InfoGeometry/Quantum/OperatorWeylHolonomy.lean',
              'lean/InfoGeometry/Geometry/AssociativeGaugeConnection.lean',
              'lean/InfoGeometry/Clifford/Cl22QuaternionCayley.lean',
              'lean/InfoGeometry/Canonical/CliffordHolonomyCurvature.lean',
          }
          assert klein['coverage_complete'] and not klein['read_failures']
          assert klein['files_selected'] == klein['files_scanned'] == len(extension_owners)
          for field in ['source_paths', 'successfully_read_paths', 'scope_roots']:
              assert set(klein[field]) == extension_owners, field
          assert klein['fail_on'] == 'error' and not klein['fail_prefixes']
          assert klein['severity_counts'].get('error', 0) == 0
          index_path = out / 'evidence-sha256.json'
          index = json.loads(index_path.read_text())
          for name, expected in index.items():
              path = Path(name.removeprefix('repository/')) if name.startswith('repository/') else out / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          for name in ['.github/workflows/cl11-graded-operators.yml',
                       'docs/CLIFFORD_COLIMIT_GRADED_OPERATOR_BRIDGE.md',
                       'docs/KLEIN_TWIST_GRADED_DOUBLING.md',
                       'docs/CLIFFORD_HOLONOMY_CURVATURE_CONTRACT.md',
                       'tools/quality/placeholder_audit.py',
                       'tools/quality/semantic_vacuity_gate.py',
                       'tools/quality/semantic_vacuity_patterns.json',
                       'tools/infra/opengauss_screener.py',
                       'lean-toolchain', 'lake-manifest.json']:
              index['repository/' + name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          for name in ['semantic-vacuity.json', 'semantic-vacuity-klein.json', 'environment.json']:
              index[name] = hashlib.sha256((out / name).read_bytes()).hexdigest()
          index_path.write_text(json.dumps(index, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl11-graded-operator-kernel-evidence
          path: |
            cl11-graded-report/report.json
            cl11-graded-report/evidence-sha256.json
            cl11-graded-report/environment.json
            cl11-graded-report/semantic-vacuity.json
            cl11-graded-report/semantic-vacuity-klein.json
            cl11-graded-report/src/CliffordDiracAudit.lean
            cl11-graded-report/*.log
          if-no-files-found: warn
