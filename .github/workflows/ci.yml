name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Fetch base ref for verification pilot
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Enable sandbox wrappers (CI)
        run: |
          source tools/infra/bootstrap_env.sh --ci

      - name: Diagnose bwrap sandbox capability
        id: bwrap_diag
        shell: bash
        run: |
          DIAG="$(./tools/infra/bwrap_preflight.sh --hint-json || true)"
          echo "$DIAG"

          python3 - "$DIAG" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          raw = sys.argv[1] if len(sys.argv) > 1 else ""
          output_path = sys.argv[2] if len(sys.argv) > 2 else os.environ.get("GITHUB_OUTPUT", "")

          def write_output(key, val):
              if not output_path:
                  return
              with open(output_path, "a", encoding="utf-8") as f:
                  f.write(f"{key}={val}\n")

          allowed_reasons = {
              "apparmor_userns",
              "uid_map_permission_denied",
              "loopback_restriction",
          }

          try:
              diag = json.loads(raw)
          except json.JSONDecodeError:
              write_output("preflight_ok", "false")
              write_output("ready", "false")
              write_output("fallback_active", "false")
              write_output("failure_reason", "diagnostic_json_parse_error")
              print("::error title=Sandbox Probe Failure::could not parse bwrap_preflight --hint-json output")
              print("raw:", raw)
              sys.exit(1)

          preflight_ok = bool(diag.get("sandbox_ready"))
          fallback_active = bool(diag.get("fallback_active"))
          failure_reason = diag.get("failure_reason") or ""

          write_output("preflight_ok", "true" if preflight_ok else "false")
          write_output("ready", "true" if preflight_ok else "false")
          write_output("fallback_active", "true" if fallback_active else "false")
          write_output("failure_reason", failure_reason)

          if preflight_ok:
              print("[bwrap-gate] preflight_ok=true; using sandbox path")
              sys.exit(0)

          if fallback_active and failure_reason in allowed_reasons:
              print("::warning title=Sandbox Limited::running fallback mode due to known restrictive reason: %s" % failure_reason)
              print("::notice title=Sandbox Decision::preflight_ok=false fallback_active=true failure_reason=%s" % failure_reason)
              print("[bwrap-gate] preflight_ok=false with allowed restricted reason, continuing")
              sys.exit(0)

          if not failure_reason:
              print("::error title=Sandbox Probe Failure::bwrap_preflight.json missing failure_reason")
          else:
              print("::error title=Sandbox Probe Failure::bwrap_preflight failed with unexpected reason: %s" % failure_reason)

          sys.exit(1)
          PY

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Update Lake dependencies
        run: lake update

      - name: Baseline build
        run: lake build

      - name: Post-build quality gate
        run: bash scripts/quality/post_build_gate.sh lean

      - name: Build compiler bridge server
        run: lake build Agent compilerBridgeServer

      - name: Run compiler bridge regression tests
        run: python3 -m unittest tests.test_compiler_bridge_rpc

      - name: Emit compiler bridge smoke summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import tempfile
          import traceback
          from pathlib import Path

          artifact_dir = Path(".artifacts") / "ci" / "compiler_bridge_smoke"
          artifact_dir.mkdir(parents=True, exist_ok=True)
          status = {"ok": True}

          lines = [
            "## Compiler Bridge Smoke Summary",
            "",
            "| Endpoint | ok | Key fields | Diagnostic codes |",
            "|---|---|---|---|",
          ]

          def diag_codes(result):
            diags = result.get("diagnostics", [])
            out = []
            for d in diags:
              if isinstance(d, dict):
                code = d.get("code")
                if isinstance(code, str):
                  out.append(code)
            return out

          try:
            from tools.frontier import compiler_bridge_client as bridge_client

            with tempfile.TemporaryDirectory() as td:
              td_path = Path(td)

              clean_file = td_path / "bridge_clean_ci.lean"
              clean_file.write_text(
                "\n".join([
                  "theorem bridge_ok (p : Prop) (hp : p) : p := by",
                  "  exact hp",
                  "",
                ]),
                encoding="utf-8",
              )

              sorry_file = td_path / "bridge_sorry_ci.lean"
              sorry_file.write_text(
                "\n".join([
                  "theorem bridge_sorry (p : Prop) : p := by",
                  "  sorry",
                  "",
                ]),
                encoding="utf-8",
              )

              common = {
                "timeout_s": 120.0,
                "server_mode": "custom",
                "inject_rpc_import_flag": False,
                "wait_for_diagnostics": True,
              }

              env_result = bridge_client.call_bridge_method(
                input_path=clean_file,
                line=0,
                character=0,
                rpc_method="getEnvFingerprint",
                decl_name=None,
                **common,
              )
              env_version = env_result.get("responseMeta", {}).get("version", {})
              env_toolchain = env_result.get("responseMeta", {}).get("env", {}).get("leanToolchain", "")
              lines.append(
                "| getEnvFingerprint | "
                f"{env_result.get('ok')} | "
                f"version={env_version.get('protocol')}/{env_version.get('schema')}, toolchain={env_toolchain} | "
                f"{diag_codes(env_result)} |"
              )

              check_result = bridge_client.call_bridge_method(
                input_path=clean_file,
                line=1,
                character=2,
                rpc_method="checkSnippet",
                decl_name=None,
                **common,
              )
              lines.append(
                "| checkSnippet (clean) | "
                f"{check_result.get('ok')} | "
                f"goalCount={check_result.get('goalCount')} | "
                f"{diag_codes(check_result)} |"
              )

              validate_ok = bridge_client.call_bridge_method(
                input_path=clean_file,
                line=0,
                character=0,
                rpc_method="validateDecl",
                decl_name="bridge_ok",
                **common,
              )
              lines.append(
                "| validateDecl (clean) | "
                f"{validate_ok.get('ok')} | "
                f"declFound={validate_ok.get('declFound')}, hasSorry={validate_ok.get('hasSorry')} | "
                f"{diag_codes(validate_ok)} |"
              )

              validate_sorry = bridge_client.call_bridge_method(
                input_path=sorry_file,
                line=0,
                character=0,
                rpc_method="validateDecl",
                decl_name="bridge_sorry",
                **common,
              )
              lines.append(
                "| validateDecl (sorry) | "
                f"{validate_sorry.get('ok')} | "
                f"declFound={validate_sorry.get('declFound')}, hasSorry={validate_sorry.get('hasSorry')} | "
                f"{diag_codes(validate_sorry)} |"
              )

              endpoint_results = {
                "getEnvFingerprint": env_result,
                "checkSnippet": check_result,
                "validateDecl_clean": validate_ok,
                "validateDecl_sorry": validate_sorry,
              }
              for name, result in endpoint_results.items():
                (artifact_dir / f"{name}.json").write_text(
                  json.dumps(result, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
                )
          except Exception as exc:
            status["ok"] = False
            status["error"] = f"{type(exc).__name__}: {exc}"
            status["traceback"] = traceback.format_exc().rstrip()
            lines.append("")
            lines.append(f"Smoke summary failed: {type(exc).__name__}: {exc}")
            lines.append("")
            lines.append("```")
            lines.append(traceback.format_exc().rstrip())
            lines.append("```")

          payload = "\n".join(lines) + "\n"
          print(payload)

          (artifact_dir / "summary.md").write_text(payload, encoding="utf-8")
          (artifact_dir / "status.json").write_text(
            json.dumps(status, indent=2, ensure_ascii=False) + "\n",
            encoding="utf-8",
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
              f.write(payload)
          PY

      - name: Upload compiler bridge smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-bridge-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/compiler_bridge_smoke
          retention-days: 7
          if-no-files-found: warn

      - name: Refresh maintained canonical graph artifacts
        run: |
          python3 tools/infra/refresh_decl_graph.py
          python3 tools/infra/refresh_blueprint_tags.py
          python3 tools/infra/run_locked_lake_build.py InfoGeometry.BlueprintTags
          python3 tools/infra/generate_theorem_surface_index.py
          python3 tools/infra/generate_hypothesis_debt_report.py
          python3 tools/infra/generate_source_sink_compression.py
          python3 tools/infra/generate_causal_report.py --out reports/dag/true-root-order.md --json-out reports/dag/true-root-order.json
          python3 tools/infra/check_bipartite_bleed.py
          python3 tools/infra/generate_structural_dedup.py
          python3 tools/infra/generate_structural_fibers.py
          python3 tools/infra/generate_semantic_quotient.py
          python3 tools/infra/generate_projection_coloring.py
          python3 tools/infra/select_openclaw_target.py

      - name: LeanTrail lock-gate conformance
        run: |
          mkdir -p artifacts/leantrail
          python3 -m leantrail.backend.indexer \
            --repo-root . \
            --snapshot-out artifacts/leantrail/graph_snapshot.json \
            --incremental \
            --incremental-radius 1
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          required_path = Path("leantrail/config/required_locks.json")
          rows = json.loads(required_path.read_text(encoding="utf-8"))
          if not isinstance(rows, list):
              raise SystemExit("leantrail/config/required_locks.json must be a list")

          for idx, row in enumerate(rows):
              if not isinstance(row, dict):
                  raise SystemExit(f"required lock row {idx} must be an object")
              src = str(row.get("from", "")).strip()
              dst = str(row.get("to", "")).strip()
              if not src or not dst:
                  raise SystemExit(f"required lock row {idx} missing from/to")

              cmd = [
                  "python3",
                  "tools/leantrail/path_lock_registry.py",
                  "--snapshot",
                  "artifacts/leantrail/graph_snapshot.json",
                  "--src",
                  src,
                  "--dst",
                  dst,
                  "--state",
                  "locked",
                  "--state-policy",
                  "exclude-failed",
                  "--registry-out",
                  "artifacts/leantrail/path_locks.jsonl",
                  "--json-out",
                  f"artifacts/leantrail/path_lock_ci_{idx}.json",
              ]
              if bool(row.get("lawful_only", True)):
                  cmd.append("--lawful-only")
              subprocess.check_call(cmd)
          PY
          python3 -m leantrail.backend.indexer \
            --repo-root . \
            --snapshot-out artifacts/leantrail/graph_snapshot.json \
            --incremental \
            --incremental-radius 1
          lake script run leantrailExport \
            --snapshot artifacts/leantrail/graph_snapshot.json \
            --to arango-json
          lake script run leantrailConformance \
            --baseline artifacts/leantrail/graph_snapshot.json \
            --baseline-format snapshot \
            --candidate artifacts/leantrail/arango \
            --candidate-format arango-json \
            --required-locked-paths leantrail/config/required_locks.json \
            --json-out artifacts/leantrail/conformance_lock_gate.json \
            --md-out artifacts/leantrail/conformance_lock_gate.md \
            --fail-on-violation

      - name: Upload LeanTrail lock-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leantrail-lock-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/leantrail/conformance_lock_gate.json
            artifacts/leantrail/conformance_lock_gate.md
            artifacts/leantrail/path_locks.jsonl
            artifacts/leantrail/path_lock_ci_*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Validate semantic flow report schema
        run: python3 tools/infra/check_semantic_flow_report.py

      - name: Verify unified verification schemas
        run: |
          cat <<'JSON' > /tmp/verification_schema_probe.json
          {
            "schema": "info_geometry.hive_multichecker_report.v1",
            "policy": {
              "path": "policy.yaml",
              "version": "1",
              "hash": "",
              "target_class": "default",
              "required_lanes": [],
              "defaults": {},
              "schema": "info_geometry.verification_policy.v1",
              "lane_tiers": {"bee_kernel_replay": "tier_a"},
              "lane_default_tier": "tier_c"
            },
            "summary": {
              "total_declarations": 1,
              "with_checker_data": 1,
              "passed_all": 1,
              "failed_any": 0,
              "failed_hard": 0,
              "failed_soft": 0,
              "missing_checker_data": 0,
              "by_tool": {}
            },
            "declarations": [
              {
                "decl": "Demo.ok",
                "module": "Demo",
                "kind": "theorem",
                "ok": true,
                "tools": {"bee_kernel_replay": {"ok": true, "checks": ["kernel"], "severity": 0}},
                "score": {"earned": 1.0, "total": 1.0},
                "checks": ["kernel"],
                "error": null,
                "policy": {
                  "required_lanes": [],
                  "required_missing": [],
                  "soft_failures": 0,
                  "hard_failures": 0,
                  "escalated_to_hard": false,
                  "lane_decisions": {"bee_kernel_replay": {"ok": true, "hard": false, "severity": 0}}
                }
              }
            ],
            "contract_artifacts": [],
            "lane_health": {"bee_kernel_replay": {"executed": true, "skipped": false, "error": false, "timeout": false, "records": 1, "failed": 0, "reason": "ok", "tier": "tier_a"}},
            "lane_metrics": {"bee_kernel_replay": {"records": 1, "passed": 1, "failed": 0, "hard_failures": 0, "soft_failures": 0, "required": false, "executed": true, "skipped": false, "error": false, "timeout": false, "records_seen": 1, "decl_health_failed": 0, "versions": [], "tier": "tier_a", "pass_rate": 1.0}}
          }
          JSON
          python3 tools/infra/validate_unified_verification_schema.py --report-json /tmp/verification_schema_probe.json

      - name: Run unified verification tests
        run: |
          python3 -m py_compile \
            tools/infra/hive_multichecker_merge.py \
            tools/infra/run_unified_verification.py \
            tools/infra/lanes/lane_leandepviz.py \
            tools/infra/lanes/lane_paperclip.py \
            tools/infra/lanes/lane_ulamai_semantic.py \
            tools/infra/lanes/lane_rethlas_refs.py \
            tools/infra/lanes/lane_socratic.py \
            tools/infra/validate_unified_verification_schema.py

      - name: Run unified verification unit tests
        run: python3 -m pytest tests/test_hive_multichecker_merge.py tests/test_run_unified_verification.py tests/test_lane_paperclip.py tests/test_run_superorganism_verification.py tests/test_verification_schema.py -q

      - name: Restore superorganism pilot hardening state
        id: restore_pilot_state
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: reports/verification/pilot/state
          key: superorganism-pilot-hardening-state-v1
          restore-keys: |
            superorganism-pilot-hardening-state-v1

      - name: Normalize superorganism pilot hardening threshold
        id: pilot_hardening_threshold
        if: github.event_name == 'pull_request'
        run: |
          threshold="${SUPERORGANISM_PILOT_HARD_AFTER:-4}"
          if ! [[ "${threshold}" =~ ^[0-9]+$ ]]; then
            echo "::warning::SUPERORGANISM_PILOT_HARD_AFTER is not an integer: '${threshold}'. Using 4."
            threshold=4
          fi
          if [ "${threshold}" -lt 3 ] || [ "${threshold}" -gt 5 ]; then
            echo "::warning::SUPERORGANISM_PILOT_HARD_AFTER must be 3-5 for staged hardening. Using 4."
            threshold=4
          fi
          echo "hard_after=${threshold}" >> "$GITHUB_OUTPUT"
        env:
          SUPERORGANISM_PILOT_HARD_AFTER: ${{ vars.SUPERORGANISM_PILOT_HARD_AFTER || '4' }}

      - name: Resolve superorganism pilot mode
        id: pilot_mode
        if: github.event_name == 'pull_request'
        env:
          SUPERORGANISM_PILOT_HARD_AFTER: ${{ steps.pilot_hardening_threshold.outputs.hard_after }}
          SUPERORGANISM_PILOT_HARD: ${{ vars.SUPERORGANISM_PILOT_HARD || 'false' }}
        run: |
          python3 tools/infra/pilot_hardening_state.py \
            --state reports/verification/pilot/state/superorganism_pilot_state.json \
            --action read \
            --hard-mode-threshold "${SUPERORGANISM_PILOT_HARD_AFTER}" \
            --force-hard "${SUPERORGANISM_PILOT_HARD}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run superorganism verification pilot (changed scope)
        if: github.event_name == 'pull_request'
        # NOTE: transitions automatically to hard mode after clean streak threshold (3-5), or when SUPERORGANISM_PILOT_HARD is set.
        env:
          SUPERORGANISM_PILOT_HARD_AFTER: ${{ steps.pilot_hardening_threshold.outputs.hard_after }}
          SUPERORGANISM_PILOT_HARD: ${{ vars.SUPERORGANISM_PILOT_HARD || 'false' }}
        continue-on-error: ${{ steps.pilot_mode.outputs.continue_on_error == 'true' }}
        run: |
          set +e
          PILOT_RUN_ID="superorganism-pilot-${{ github.run_id }}-${{ github.run_attempt }}"
          PILOT_OUTPUT_DIR="reports/verification/pilot/${PILOT_RUN_ID}"
          PILOT_UPDATE_PAYLOAD="${PILOT_OUTPUT_DIR}/pilot_hardening_update.json"
          python3 tools/infra/run_superorganism_verification.py \
            --scope changed \
            --decl-index artifacts/dag/index/decls.jsonl \
            --policy "${{ steps.pilot_mode.outputs.policy_path }}" \
            --base-ref origin/"${{ github.base_ref }}" \
            --decl-prefix InfoGeometry. \
            --output-root reports/verification/pilot \
            --run-id "${PILOT_RUN_ID}" \
            --json-out "${PILOT_OUTPUT_DIR}/unified.json" \
            --md-out "${PILOT_OUTPUT_DIR}/summary.md" \
            --pilot-state reports/verification/pilot/state/superorganism_pilot_state.json \
            --pilot-hard-mode-threshold "${SUPERORGANISM_PILOT_HARD_AFTER:-4}" \
            --pilot-force-hard "${SUPERORGANISM_PILOT_HARD:-false}" \
            --pilot-hardening-json "${PILOT_UPDATE_PAYLOAD}" \
            --primary-summary-path "$GITHUB_STEP_SUMMARY" \
            --pilot-github-output "$GITHUB_OUTPUT"
          rc=$?
          exit "$rc"

      - name: Upload superorganism pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superorganism-verification-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/verification/pilot/superorganism-pilot-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: warn

      - name: Save superorganism pilot hardening state
        if: github.event_name == 'pull_request' && always()
        uses: actions/cache/save@v4
        with:
          path: reports/verification/pilot/state
          key: superorganism-pilot-hardening-state-v1

      - name: Upload hypothesis debt report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-debt-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/dag/hypothesis-debt-index.json
            reports/dag/hypothesis-debt-index.md
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce canonical policy
        run: python3 tools/infra/canonical_policy_lint.py

      - name: Enforce nested package v4.28 policy
        run: |
          if [ -d .lake/packages ]; then
            scripts/infra/enforce-v428-local-manifests.sh
          else
            echo "[policy] no .lake/packages directory; skipping nested manifest check"
          fi

      - name: Enforce agentic autonomy policy
        run: python3 tools/infra/agentic_policy_lint.py

      - name: Baseline graph extraction
        run: python3 -m scripts make-graph --probe-unresolved --out docs-map/graph.json

      - name: Baseline refactor plan
        run: python3 -m scripts refactor-plan --module-graph docs-map/module_graph.json --errors .artifacts/nonbuildable_errors.json --out docs-map/refactor_plan.md

      - name: Enforce archive-drafts policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("docs-map/module_graph.json").read_text(encoding="utf-8"))
          non_buildable = data.get("non_buildable_modules", [])
          offenders = [m for m in non_buildable if not m.startswith("InfoGeometry.Archive.Drafts.")]

          if offenders:
            print("[ci] non-archive non-buildable modules detected:")
            for m in offenders:
              print(f"  - {m}")
            raise SystemExit(1)

          print(f"[ci] archive policy OK: {len(non_buildable)} non-buildable modules, all under InfoGeometry.Archive.Drafts.")
          PY

      - name: Lint canonical surface
        run: lake lint

      - name: Reject experimental imports in canonical modules
        run: |
          if grep -REn "^import InfoGeometry\\.Experimental$" \
            lean/InfoGeometry.lean lean/InfoGeometry/Library.lean lean/InfoGeometry/Canonical \
            --include='*.lean'; then
            echo "Canonical modules must not import InfoGeometry.Experimental"
            exit 1
          fi

      - name: Verify archive exclusion from canonical imports
        run: |
          if grep -REn "^import InfoGeometry\\.Archive\\." \
            lean/InfoGeometry.lean lean/InfoGeometry/Library.lean lean/InfoGeometry/Canonical \
            --include='*.lean'; then
            echo "Canonical modules must not import InfoGeometry.Archive.*"
            exit 1
          fi

      - name: Enforce surrogate isolation
        run: scripts/audit_surrogates.sh
