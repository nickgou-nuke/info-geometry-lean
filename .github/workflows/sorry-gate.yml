name: Sorry Gate
on: [push, pull_request]
jobs:
  sorry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: lake build
      - name: Repository-wide Lean debt audit
        run: |
          python3 tools/quality/repo_lean_scope_audit.py --fail-on tracked
          python3 tools/quality/repo_lean_quarantine_audit.py --fail-on-findings
      - name: Count sorries
        run: |
          SORRIES=$(lake build 2>&1 | grep -c "sorry" || true)
          echo "Sorries: $SORRIES"
          if [ "$SORRIES" -gt 0 ]; then exit 1; fi
