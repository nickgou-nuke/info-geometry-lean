name: Gauss-Jordan kernel check

on:
  pull_request:
    branches: [main]
    paths:
      - "lean/InfoGeometry/Algebra/GaussJordan.lean"
      - ".github/workflows/gauss-jordan.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-
      - name: Stub unavailable path-only packages
        run: |
          make_lean_stub() {
            dir="$1"
            name="$2"
            mkdir -p "$dir"
            cat > "$dir/lakefile.lean" <<EOF
          import Lake
          open Lake DSL
          package $name
          EOF
          }
          mkdir -p external_refs/atlas-lean
          cat > external_refs/atlas-lean/lakefile.toml <<'EOF'
          name = "Atlas"
          version = "0.0.0"
          EOF
          make_lean_stub external_refs/gift-framework-core GIFT
          make_lean_stub lib/InfoGeometryCore InfoGeometryCore
      - name: Build Gauss-Jordan module
        id: lean-build
        continue-on-error: true
        run: lake build InfoGeometry.Algebra.GaussJordan > gauss-jordan-build.log 2>&1
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauss-jordan-build-log
          path: gauss-jordan-build.log
          if-no-files-found: error
      - name: Enforce successful kernel check
        if: always()
        run: |
          cat gauss-jordan-build.log
          test "${{ steps.lean-build.outcome }}" = success
