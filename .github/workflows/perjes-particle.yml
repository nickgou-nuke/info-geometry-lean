name: Perjes particle and Klein transport (scoped)
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Twistor/Perjes*.lean'
      - 'lean/InfoGeometry/Twistor/TwistorKinematicTensor.lean'
      - 'lean/InfoGeometry/Twistor/TwistorConstituent*.lean'
      - 'lean/InfoGeometry/Twistor/HomogeneousTwistorCech.lean'
      - 'lean/InfoGeometry/Twistor/PenroseContourTransform.lean'
      - 'lean/InfoGeometry/Twistor/TwistorInternalSymmetry.lean'
      - 'lean/InfoGeometry/Twistor/KleinTwistorPinTransport.lean'
      - 'lean/InfoGeometry/Physics/Pin55Glide.lean'
      - 'tools/quality/check_perjes_particle.py'
      - '.github/workflows/perjes-particle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perjes-particle-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch exact source and pinned Mathlib without external submodules
        shell: bash
        env:
          SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init project
          git -C project remote add origin "https://github.com/${{ github.repository }}.git"
          git -C project fetch --depth=1 origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          pin = next(p for p in json.loads(pathlib.Path('project/lake-manifest.json').read_text())['packages'] if p['name'] == 'mathlib')
          subprocess.run(['git', 'init', 'pinned-mathlib'], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'remote', 'add', 'origin', pin['url']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'fetch', '--depth=1', 'origin', pin['rev']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('MATHLIB_REV=' + pin['rev'] + '\n')
          PY
      - name: Restore pinned dependency artifacts only
        id: mathlib-cache
        uses: actions/cache/restore@v4
        with:
          path: pinned-mathlib/.lake
          key: perjes-pinned-mathlib-${{ env.MATHLIB_REV }}-v1
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Compile source closure and audit transitive axioms serially
        shell: bash
        run: |
          set -euo pipefail
          ps -eo pid,comm,args
          python3 project/tools/quality/check_perjes_particle.py --mathlib-root pinned-mathlib --output verification
      - name: Export exact public verification runtime in bounded parts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-export runtime-parts
          LEAN_ROOT="$(dirname "$(dirname "$(cd project && elan which lean)")")"
          tar --exclude='*.a' --exclude='*.o' --exclude='*.c' -I 'zstd -T2 -3' -cf runtime-export/lean-runtime.tar.zst -C "$LEAN_ROOT" bin/lean bin/lake lib
          tar --exclude='.git' --exclude='*.a' --exclude='*.o' --exclude='*.c' --exclude='build/ir' -I 'zstd -T2 -3' -cf runtime-export/mathlib-runtime.tar.zst -C pinned-mathlib Mathlib .lake lean-toolchain lake-manifest.json lakefile.lean
          cp project/lean-toolchain runtime-export/
          git -C pinned-mathlib rev-parse HEAD > runtime-export/mathlib-revision.txt
          (cd runtime-export && sha256sum *.tar.zst > SHA256SUMS)
          tar -cf - -C runtime-export . | split -b400M -d -a2 - runtime-parts/part-
          rm runtime-export/*.tar.zst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-00
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-00
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-01
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-02
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-03
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-04
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-05
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-runtime-06
          compression-level: 0
          retention-days: 3
          path: runtime-parts/part-06
      - name: Save pinned dependency artifacts
        if: always() && steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pinned-mathlib/.lake
          key: perjes-pinned-mathlib-${{ env.MATHLIB_REV }}-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perjes-particle-verification
          path: |
            verification/**/*.log
            verification/**/*.json
            verification/**/*.txt
            verification/src
