name: Real flavor covariance and compression

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Canonical/Flavor*.lean'
      - 'lean/InfoGeometry/Canonical/MatrixTwoNoncommutativity.lean'
      - 'lean/InfoGeometry/Canonical/DiscreteDiracHodgeChiral.lean'
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Streaming/BipartiteGraphDirac.lean'
      - 'verification/real-flavor/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'tools/build_lock.py'
      - 'tools/infra/build.py'
      - 'tools/infra/opengauss_screener.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/pathing.py'
      - '.github/workflows/real-flavor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-flavor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: real-flavor-deps-lean4341-d13f23b7-${{ runner.os }}-v1
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1
      - name: Restore pinned Mathlib artifacts
        run: python3 verification/real-flavor/check.py exe cache get
      - name: Build and freshly audit every owned declaration
        run: python3 verification/real-flavor/check.py --final
      - name: Screen the mathematical owners
        run: >-
          python3 tools/infra/opengauss_screener.py --strict
          lean/InfoGeometry/Canonical/FlavorReadout.lean
          lean/InfoGeometry/Canonical/FlavorDiracGram.lean
          lean/InfoGeometry/Canonical/FlavorCompression.lean
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-flavor-validation
          path: artifacts/verification/real-flavor
