name: Reviewed PR Integration

on:
  push:
    branches: ['codex/integrate-reviewed-prs-20260921', 'main']
    paths:
      - 'lean/**'
      - 'proofs/PolarizedShearSpinAudit.lean'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/reviewed_native.py'
      - 'tools/build_lock.py'
      - 'tools/infra/check_runtime_acceptance.py'
      - 'tools/infra/pantograph_environment.py'
      - 'tools/infra/build.py'
      - 'tools/pathing.py'
      - 'external_refs/**'
      - 'InfoGeometryCore/**'
      - 'lakefile.lean'
      - 'tests/test_reviewed_audit_source.py'
      - 'tools/quality/reviewed_prs_20260921.json'
      - '.github/workflows/reviewed-pr-integration.yml'
      - '.gitmodules'
      - 'tools/infra/ci_bootstrap.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  pull_request:
    branches: ['main']
    paths:
      - 'lean/**'
      - 'proofs/PolarizedShearSpinAudit.lean'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/reviewed_native.py'
      - 'tools/build_lock.py'
      - 'tools/infra/check_runtime_acceptance.py'
      - 'tools/infra/pantograph_environment.py'
      - 'tools/infra/build.py'
      - 'tools/pathing.py'
      - 'external_refs/**'
      - 'InfoGeometryCore/**'
      - 'lakefile.lean'
      - 'tests/test_reviewed_audit_source.py'
      - 'tools/quality/reviewed_prs_20260921.json'
      - '.github/workflows/reviewed-pr-integration.yml'
      - '.gitmodules'
      - 'tools/infra/ci_bootstrap.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-pr-integration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
          submodules: recursive
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.elan
            project/.lake
          key: reviewed-native65-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json', 'project/lakefile.lean') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Check audit generator contracts
        run: python3 project/tests/test_reviewed_audit_source.py
      - name: Check native path dependencies
        working-directory: project
        run: python3 tools/infra/ci_bootstrap.py paths --root .
      - name: Initialize pinned native dependencies
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBOOT'
          from pathlib import Path
          import subprocess
          from tools.build_lock import BuildLock, DEFAULT_BUILD_LOCK_PATH
          from tools.infra.check_runtime_acceptance import idle
          from tools.infra.ci_bootstrap import verify_version
          with BuildLock(DEFAULT_BUILD_LOCK_PATH, 'reviewed-native-bootstrap', block=True) as lock:
              idle()
              banner = subprocess.check_output(['lake', 'env', 'lean', '--version'],
                  text=True, pass_fds=(lock.fileno(),))
              verify_version(Path('lean-toolchain').read_text(), banner)
              subprocess.run(['lake', 'exe', 'cache', 'get'], check=True,
                  pass_fds=(lock.fileno(),))
          PYBOOT
          git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.lean
      - name: Compile reviewed union and audit every declaration
        working-directory: project
        run: |
          python3 tools/quality/check_reviewed_prs.py \
            --mode native --clean-release --wait-for-build-lock \
            --output scratch/native_reviewed_runs/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan
            project/.lake
          key: reviewed-native65-${{ runner.os }}-${{ hashFiles('project/lean-toolchain', 'project/lake-manifest.json', 'project/lakefile.lean') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-pr-kernel-report
          path: |
            project/scratch/native_reviewed_runs/*/report.json
            project/scratch/native_reviewed_runs/*/*.log
          if-no-files-found: warn
