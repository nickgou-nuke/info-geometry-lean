name: Dyadic colimit trace and dissipation

on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Algebra/MatrixAmplification.lean'
      - 'lean/InfoGeometry/Algebra/DirectLimitSuperClosureLemmas.lean'
      - 'lean/InfoGeometry/Algebra/InductiveSuperClosureLemmas.lean'
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Categorical/SequentialRingColimit.lean'
      - 'lean/InfoGeometry/Categorical/MatrixAmplificationTower.lean'
      - 'lean/InfoGeometry/Categorical/MatrixAmplificationShellSymmetry.lean'
      - 'lean/InfoGeometry/Canonical/DyadicMatrixTraceColimit.lean'
      - 'lean/InfoGeometry/Canonical/DyadicMatrixTraceShellSymmetry.lean'
      - 'lean/InfoGeometry/Canonical/DyadicColimitDissipationAudit.lean'
      - 'lean/InfoGeometry/Modular/GKSLDissipatorAlgebraic.lean'
      - 'lean/InfoGeometry/Modular/GKSLDissipationIdentity.lean'
      - 'verification/matrix-amplification/**'
      - 'tools/build_lock.py'
      - 'tools/infra/build.py'
      - 'tools/infra/opengauss_screener.py'
      - 'tools/quality/reviewed_audit_source.py'
      - 'tools/quality/proof_proxy_staged_gate.py'
      - 'tools/quality/proof_proxy_diff_gate.py'
      - 'tests/test_opengauss_existential_witness.py'
      - 'tests/test_opengauss_protocols.py'
      - 'tests/test_native_matrix_witness.py'
      - 'tests/test_proof_proxy_staged_gate.py'
      - 'tests/test_proof_proxy_partial_commit.py'
      - 'tests/test_proof_proxy_diff_gate.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/dyadic-colimit-dissipation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dyadic-colimit-dissipation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the source-screening test runner
        run: python3 -m pip install pytest==8.3.5
      - name: Check source-screening regressions under the shared lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/matrix-amplification/logs/dyadic-colimit
          python3 - <<'PY' 2>&1 | tee verification/matrix-amplification/logs/dyadic-colimit/source-screening.log
          import subprocess
          import sys
          from tools.build_lock import acquire_build_lock
          tests = [
              'tests/test_opengauss_existential_witness.py',
              'tests/test_opengauss_protocols.py',
              'tests/test_native_matrix_witness.py',
              'tests/test_proof_proxy_staged_gate.py',
              'tests/test_proof_proxy_partial_commit.py',
              'tests/test_proof_proxy_diff_gate.py',
          ]
          lock = acquire_build_lock(None, 'dyadic-colimit-source-screening', block=True)
          try:
              result = subprocess.run([sys.executable, '-m', 'pytest', *tests, '-q'])
          finally:
              lock.release()
          raise SystemExit(result.returncode)
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            verification/matrix-amplification/.lake
          key: ${{ runner.os }}-dyadic-colimit-dissipation-${{ hashFiles('verification/matrix-amplification/lean-toolchain', 'verification/matrix-amplification/lake-manifest.json') }}
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1
      - name: Retrieve pinned dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/matrix-amplification/logs/dyadic-colimit
          python3 verification/matrix-amplification/check.py exe cache get 2>&1 | tee verification/matrix-amplification/logs/dyadic-colimit/cache.log
      - name: Build the four owners and exhaustive declaration audit
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/matrix-amplification/check.py build InfoGeometry.Canonical.DyadicColimitDissipationAudit 2>&1 | tee verification/matrix-amplification/logs/dyadic-colimit/build.log
      - name: Freshly audit every owned declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/matrix-amplification/check.py env lean lean/InfoGeometry/Canonical/DyadicColimitDissipationAudit.lean 2>&1 | tee verification/matrix-amplification/logs/dyadic-colimit/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          from tools.quality.reviewed_audit_source import parse_audit_output
          targets = [
              'InfoGeometry.Canonical.DyadicMatrixTraceColimit',
              'InfoGeometry.Modular.GKSLDissipationIdentity',
              'InfoGeometry.Categorical.MatrixAmplificationShellSymmetry',
              'InfoGeometry.Canonical.DyadicMatrixTraceShellSymmetry',
          ]
          log = Path('verification/matrix-amplification/logs/dyadic-colimit/axioms.log')
          print(parse_audit_output(log.read_text(), targets))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dyadic-colimit-dissipation-verification
          path: verification/matrix-amplification/logs/dyadic-colimit
