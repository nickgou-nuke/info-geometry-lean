name = "infogeometry_grh_native"
defaultTargets = [
  "InfoGeometry.Arithmetic.WeightedMangoldtSmoothing",
  "InfoGeometry.Arithmetic.SmoothedMangoldtMellin",
  "InfoGeometry.Arithmetic.RiemannHypothesisHalfPlaneReduction",
  "InfoGeometry.Arithmetic.RealDoubledCenteredXiReadout"
]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
maxHeartbeats = 4000000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect"
rev = "54d3fb249685db8e5a564e0b3f331cff77991607"

[[lean_lib]]
name = "InfoGeometry"
srcDir = "../../../lean"

[[lean_lib]]
name = "NativeAxiomAudit"
