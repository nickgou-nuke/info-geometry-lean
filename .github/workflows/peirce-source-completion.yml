name: Peirce source completion
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/Core/PeirceQuadraticIteration.lean'
      - 'lean/InfoGeometry/Core/PeirceIterationWitness.lean'
      - 'lean/InfoGeometry/Core/PeirceSourceOrder.lean'
      - 'tools/quality/check_peirce_source_completion.py'
      - '.github/workflows/peirce-source-completion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peirce-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
          key: peirce-completion-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Install exact declared compiler and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 2 --connect-timeout 15 --max-time 90 -sSf \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          pin = next(p for p in json.loads(pathlib.Path('lake-manifest.json').read_text())['packages'] if p['name'] == 'mathlib')
          dest = os.path.join(os.environ['RUNNER_TEMP'], 'peirce-completion-mathlib')
          subprocess.run(['git', 'init', dest], check=True)
          subprocess.run(['git', '-C', dest, 'remote', 'add', 'origin', pin['url']], check=True)
          subprocess.run(['git', '-C', dest, 'fetch', '--depth=1', 'origin', pin['rev']], check=True)
          subprocess.run(['git', '-C', dest, 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Compile exact source closure and audit all owned declarations
        run: |
          python3 tools/quality/check_peirce_source_completion.py \
            --mathlib-root "$RUNNER_TEMP/peirce-completion-mathlib" \
            --output verification-peirce-completion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peirce-source-completion-evidence
          path: |
            verification-peirce-completion/**/*.log
            verification-peirce-completion/**/*.json
            verification-peirce-completion/**/*.txt
            verification-peirce-completion/src
