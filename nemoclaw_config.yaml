# ⚗️ NEMOCLAW CONFIGURATION: The Local Spire Runtime
# Configuration for the local proving collective under Hermes orchestration.

version: "1.1"
agent:
  name: "Nemo-ClawCode-Caretaker"
  orchestrator: "hermes"

# Operator surfaces are execution planes, not inference providers.
operator_surfaces:
  primary:
    name: "codex-cli"
    role: "caretaker_executor"
    enabled: true
    command: "codex"
    responsibilities:
      - "workspace edits"
      - "tool orchestration"
      - "compilation"
      - "gate execution"
      - "runtime repair"
  secondary:
    name: "gemini-cli"
    role: "creative_research_sidecar"
    enabled: true
    auto_route: false
    explicit_operator_only: true
    guard_command: "tools/infra/run_gemini_guarded.sh"
    mode: "irregular_dreaming_sidecar"
    never_poll: true
    command: "gemini"
    responsibilities:
      - "deep research packet drafting"
      - "socratic expansion"
      - "bridge ideation"
    forbidden_auth_paths:
      - "google-gemini-cli-oauth-adapter"
      - "gemini-code-assist-oauth"
      - "antigravity-oauth"
      - "token-extraction"
      - "quota-piggybacking"

lanes:
  # Hermes manages the swarm but does not certify truth.
  hermes:
    role: "swarm_manager"
    config_path: "./tools/infra/hermes_config.yaml"
    default_plane: "orchestrate"

  # Default local dialogue/prover lane for Socratic proof search.
  discovery_engine:
    provider: "custom"
    role: "socratic_dialogue"
    base_url: "http://127.0.0.1:8001/v1"
    api_key: "token-123"
    model: "deepseek-prover-v2-7b-q8_0.gguf"

  # High-level planning/orchestration lane for Hermes.
  planner_engine:
    provider: "custom"
    role: "quantized_leanstral_planner"
    base_url: "http://127.0.0.1:18789/v1"
    api_key: "token-123"
    model: "leanstral-gguf"

  # Conservative local audit/system lane.
  logic_engine:
    provider: "custom"
    role: "quantized_leanstral_audit_prior"
    base_url: "http://127.0.0.1:18789/v1"
    api_key: "token-123"
    model: "leanstral-gguf"

  # Execution surface only when Hermes routes a task into mutation/build/gates.
  code_engine:
    provider: "clawcode"
    operator_surface: "codex-cli"
    integrated_tools:
      - "lean4-compiler"
      - "semantic-audit"
      - "dag-doctor"

agent_runtime:
  defaults:
    planner: "hermes"
    planner_lane: "planner_engine"
    exploration_lane: "discovery_engine"
    audit_lane: "logic_engine"
    execution_lane: "code_engine"
  routing_policy:
    codex_on_demand_only: true
    hermes_decides_execution: true
    exploration_precedes_mutation: true
    lean_is_truth_authority: true
    gemini_auto_route: false
    gemini_explicit_operator_only: true
    forbid_antigravity_oauth_piggybacking: true

# Security: NVIDIA OpenShell Sandbox
sandbox:
  enabled: true
  provider: "openshell"
  allowed_directories:
    - "./lean"
    - "./docs"
    - "./quarantine"
    - "./skills"

# Runtime Autonomy Policy (Required by agentic_policy_lint.py)
runtime_policy:
  planes:
    allowed:
      - "prove"
      - "orchestrate"
      - "publish"
    default: "prove"
  
  heartbeat:
    enabled: true
    allowed_planes:
      - "prove"
      - "orchestrate"
  
  publish:
    enabled: true
    default_policy: "deny"
    require_two_key_approval: true
    approval_keys:
      - "human"
      - "policy_engine"

tools:
  - name: "semantic-audit"
    enabled: true
    allowed_plane: "orchestrate"
    allows_outbound_publish: false
