name: Real doubled ideals and Krein operators
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/TripotentCornerEndEquivalence.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSpine/IdealStarGramDensity.lean'
      - 'lean/InfoGeometry/Physics/KreinDiracBlock.lean'
      - 'lean/InfoGeometry/CliffordWeyl/RealDoubledIdealMetric.lean'
      - 'lean/InfoGeometry/Clifford/Cl11DoubledGram.lean'
      - 'lean/InfoGeometry/Examples/RealKreinIdealCounterexamples.lean'
      - 'tools/quality/check_real_krein_ideal.py'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/check_bilateral_kernel.py'
      - 'tools/build_lock.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/real-krein-ideal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-krein-ideal-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Fetch pinned Mathlib
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('project')
          pin = next(p for p in json.loads((root/'lake-manifest.json').read_text())['packages'] if p['name']=='mathlib')
          subprocess.run(['git','init','pinned-mathlib'], check=True)
          subprocess.run(['git','-C','pinned-mathlib','remote','add','origin',pin['url']], check=True)
          subprocess.run(['git','-C','pinned-mathlib','fetch','--depth=1','origin',pin['rev']], check=True)
          subprocess.run(['git','-C','pinned-mathlib','checkout','--detach','FETCH_HEAD'], check=True)
          PY
      - name: Install exact toolchain and hydrate cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
          cd pinned-mathlib
          "$HOME/.elan/bin/lake" exe cache get
      - name: Compile exact source closure and audit declarations
        run: |
          python3 project/tools/quality/check_real_krein_ideal.py \
            --mathlib-root pinned-mathlib --output verification
      - name: Record root-package gate at its actual scope
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          out = pathlib.Path('verification')
          out.mkdir(exist_ok=True)
          command = ['python3', 'tools/infra/run_locked_lake_build.py', '--all-default-targets']
          result = subprocess.run(command, cwd='project', text=True,
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (out/'root-package.log').write_text(result.stdout)
          (out/'root-package.json').write_text(json.dumps({
              'command': command, 'returncode': result.returncode,
              'scope': 'root Lake default-target gate; separate from exact source verification'
          }, indent=2)+'\n')
          print(result.stdout)
          print('ROOT_PACKAGE_RETURNCODE:', result.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-krein-ideal-verification
          path: |
            verification/**/*.log
            verification/**/*.json
            verification/**/*.txt
            verification/src
