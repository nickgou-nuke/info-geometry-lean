# 📜 HERMES CONFIG: Local Repository Isolation
# This file ensures Hermes remains a tool of retrieval, not an owner of truth.

model:
  provider: custom
  base_url: http://127.0.0.1:18789/v1
  api_key: token-123
  default: Qwen/Qwen3.6-35B-A3B-FP8
  role: compact_local_route_selection
  policy_note: "Do not use Gemini/Google Code Assist/Antigravity OAuth providers from Hermes. Gemini CLI is explicit-operator-use only."

fallback_models:
  - provider: custom
    base_url: http://127.0.0.1:8001/v1
    api_key: token-123
    model: deepseek-prover-v2-7b-q8_0.gguf

# Skill and Memory Isolation
# Hermes is forbidden from auto-learning into the Spire's authoritative skills.
# It uses a local quarantine for session-specific tactics.
paths:
  skills: "./quarantine/hermes_skills"
  memory: "./quarantine/hermes_memory"
  research_packets: "./quarantine/hermes_memory/research_packets"

# Task Enforcement
# Hermes must always operate on the provided task.json manifest.
runtime:
  statement_lock: true
  audit_required: true
  codex_on_demand_only: true
  execution_surface: codex-cli
  gemini_auto_route: false
  gemini_explicit_operator_only: true
  gemini_guard_command: "tools/infra/run_gemini_guarded.sh"
  gemini_mode: "irregular_dreaming_sidecar"
  gemini_never_poll: true
  forbidden_providers:
    - google-gemini-cli
    - gemini-code-assist-oauth
    - antigravity-oauth
  forbidden_auth_patterns:
    - token_extraction
    - token_harvesting
    - quota_piggybacking
    - oauth_proxying
