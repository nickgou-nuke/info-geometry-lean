name: Signed real transport proofs
on:
  pull_request:
    paths:
      - 'lean/InfoGeometry/OperatorAlgebra/Signed*.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceSignedTransport.lean'
      - 'tools/quality/check_signed_transport.py'
      - '.github/workflows/signed-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-transport-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
          key: signed-transport-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            real-boundary-${{ runner.os }}-
            opposite-peirce-${{ runner.os }}-
      - name: Install declared Lean and exact Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          pin = next(p for p in json.loads(pathlib.Path('lake-manifest.json').read_text())['packages'] if p['name'] == 'mathlib')
          dest = os.path.join(os.environ['RUNNER_TEMP'], 'signed-mathlib')
          subprocess.run(['git', 'init', dest], check=True)
          subprocess.run(['git', '-C', dest, 'remote', 'add', 'origin', pin['url']], check=True)
          subprocess.run(['git', '-C', dest, 'fetch', '--depth=1', 'origin', pin['rev']], check=True)
          subprocess.run(['git', '-C', dest, 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Compile exact source closure and audit all owned declarations
        run: |
          python3 tools/quality/check_signed_transport.py \
            --mathlib-root "$RUNNER_TEMP/signed-mathlib" --output verification-signed
      - name: Check semantic vacuity
        run: |
          python3 tools/quality/semantic_vacuity_gate.py \
            lean/InfoGeometry/OperatorAlgebra/SignedBoundaryTransport.lean \
            lean/InfoGeometry/OperatorAlgebra/PeirceSignedTransport.lean \
            lean/InfoGeometry/OperatorAlgebra/SignedTransportMetric.lean \
            lean/InfoGeometry/OperatorAlgebra/SignedTransportWitness.lean \
            lean/InfoGeometry/OperatorAlgebra/SignedTransportOrder.lean \
            --fail-on error --json-out verification-signed/vacuity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-transport-verification
          path: |
            verification-signed/**/*.log
            verification-signed/**/*.json
            verification-signed/**/*.txt
            verification-signed/src
