name: NonAssoc Derivation Exponential Narrow Check

on:
  pull_request:
    paths:
      - "lean/InfoGeometry/Algebra/NonAssocDerivationKernel.lean"
      - "lean/InfoGeometry/Algebra/NonAssocDerivationExponential.lean"
      - ".github/workflows/nonassoc-derivation-kernel-narrow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrow-kernel-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build focused owners in isolated Mathlib project
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/nonassoc-derivation-exponential-check"
          mkdir -p "$work"
          cd "$work"

          cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain

          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package nonAssocDerivationExponentialCheck

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.28.1"

          lean_lib DAG

          @[default_target]
          lean_lib InfoGeometry
          EOF

          ln -s "$GITHUB_WORKSPACE/lean/InfoGeometry" InfoGeometry
          ln -s "$GITHUB_WORKSPACE/lean/DAG" DAG
          ln -s "$GITHUB_WORKSPACE/lean/DAG.lean" DAG.lean

          lake update
          lake exe cache get
          lake build InfoGeometry.Algebra.NonAssocDerivationKernel
          lake build InfoGeometry.Algebra.NonAssocDerivationExponential
