name = "real_matrix_split_validation"
srcDir = "../../lean"
packagesDir = "../../.lake/packages"
defaultTargets = ["InfoGeometry.OperatorAlgebra.RealMatrixSplitAll", "InfoGeometry.OperatorAlgebra.RealMatrixSplitAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "InfoGeometry"

# Use the same tracked Core owner as the root path package. Library srcDir
# is relative to the package srcDir above (../../lean).
[[lean_lib]]
name = "InfoGeometryCore"
srcDir = "../lib/InfoGeometryCore"
globs = ["InfoGeometryCore.*"]
