name: Noncommutative curvature and Dirichlet operators (scoped)
on:
  pull_request:
    paths:
      - '.github/workflows/yang-mills-operator-extraction.yml'
      - 'docs/YANG_MILLS_OPERATOR_EXTRACTION.md'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'lean/InfoGeometry/Algebra/DerivationLieLane.lean'
      - 'lean/InfoGeometry/Algebra/DerivationLieLaneRepresentation.lean'
      - 'lean/InfoGeometry/Algebra/FiniteSpinAlgebra.lean'
      - 'lean/InfoGeometry/Algebra/MatrixNoncommutativity.lean'
      - 'lean/InfoGeometry/Algebra/NonAssocDerivation.lean'
      - 'lean/InfoGeometry/Analysis/ComplexMatrixJacobi.lean'
      - 'lean/InfoGeometry/Analysis/ComplexMatrixLogDetCalculus.lean'
      - 'lean/InfoGeometry/Analysis/MatrixTraceQuadratic.lean'
      - 'lean/InfoGeometry/Analysis/OperatorDirichletLaplacian.lean'
      - 'lean/InfoGeometry/Analysis/OperatorDirichletScaling.lean'
      - 'lean/InfoGeometry/Analysis/OperatorDirichletSpectralGap.lean'
      - 'lean/InfoGeometry/Canonical/FiniteBogoliubovFrameDeformationEntropy.lean'
      - 'lean/InfoGeometry/Canonical/MatrixDetExpTraceJacobi.lean'
      - 'lean/InfoGeometry/Canonical/MatrixEntropyUnitaryOrbit.lean'
      - 'lean/InfoGeometry/Canonical/PolarFrameTraceDensity.lean'
      - 'lean/InfoGeometry/Canonical/QuantumRelativeSurprisal.lean'
      - 'lean/InfoGeometry/Core/PeirceCompressionDefect.lean'
      - 'lean/InfoGeometry/Core/PeirceDecomposition.lean'
      - 'lean/InfoGeometry/Core/PeirceGrading.lean'
      - 'lean/InfoGeometry/Geometry/AssociativeGaugeConnection.lean'
      - 'lean/InfoGeometry/Geometry/DerivationMatrixCurvature.lean'
      - 'lean/InfoGeometry/Geometry/MatrixCurvatureEnergy.lean'
      - 'lean/InfoGeometry/Geometry/MatrixCurvatureHessian.lean'
      - 'lean/InfoGeometry/Geometry/MatrixCurvatureNonconvexity.lean'
      - 'lean/InfoGeometry/Geometry/PeirceCurvatureHessian.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/DerivationCurvatureVariation.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/DerivationDifferentialForms.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/PeirceCurvatureDefect.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/TracialGNSCommutator.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/TracialGNSDirichlet.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/TracialGNSGauge.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/TracialGNSMatrixTests.lean'
      - 'lean/InfoGeometry/OperatorAlgebra/TracialGNSRightMultiplication.lean'
      - 'tools/build_lock.py'
      - 'tools/quality/check_peirce_bdg_geometry.py'
      - 'tools/quality/check_reviewed_prs.py'
      - 'tools/quality/check_yang_mills_operator_extraction.py'
      - 'tools/quality/reviewed_audit_source.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yang-mills-operator-extraction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch exact public source without initializing external submodules
        shell: bash
        env:
          SOURCE_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init project
          git -C project remote add origin "https://github.com/${{ github.repository }}.git"
          git -C project fetch --depth=1 origin "$SOURCE_REV"
          git -C project checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          project = pathlib.Path('project')
          manifest = json.loads((project / 'lake-manifest.json').read_text())
          pin = next(p for p in manifest['packages'] if p['name'] == 'mathlib')
          subprocess.run(['git', 'init', 'pinned-mathlib'], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'remote', 'add', 'origin', pin['url']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'fetch', '--depth=1', 'origin', pin['rev']], check=True)
          subprocess.run(['git', '-C', 'pinned-mathlib', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < project/lean-toolchain)"
      - name: Compile full source closure and audit new declarations
        shell: bash
        run: |
          set -euo pipefail
          ps -eo pid,comm,args
          python3 project/tools/quality/check_yang_mills_operator_extraction.py \
            --mathlib-root pinned-mathlib --output verification --fetch-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yang-mills-operator-extraction-verification
          path: |
            verification/**/*.log
            verification/**/*.json
            verification/**/*.txt
            verification/src
