name: Gauss-Jordan kernel check

on:
  pull_request:
    branches: [main]
    paths:
      - "lean/InfoGeometry/Algebra/GaussJordan.lean"
      - "lean/InfoGeometry/Algebra/GaussJordan/**"
      - ".github/workflows/gauss-jordan.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean toolchain
        id: elan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-v4.28.0
      - name: Install elan and Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.28.0
      - name: Save Lean toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-v4.28.0
      - name: Restore Mathlib checkout and oleans
        id: mathlib-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages/mathlib
          key: ${{ runner.os }}-mathlib-v4.28.0
      - name: Prepare Mathlib v4.28.0
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .lake/packages/mathlib
          mkdir -p .lake/packages
          git clone --depth 1 --branch v4.28.0 \
            https://github.com/leanprover-community/mathlib4.git \
            .lake/packages/mathlib
          cd .lake/packages/mathlib
          lake exe cache get
      - name: Save Mathlib checkout and oleans
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages/mathlib
          key: ${{ runner.os }}-mathlib-v4.28.0
      - name: Build Gauss-Jordan modules
        id: lean-build
        continue-on-error: true
        run: |
          cd .lake/packages/mathlib
          rm -rf InfoGeometry
          cp -R "$GITHUB_WORKSPACE/lean/InfoGeometry" InfoGeometry
          {
            LEAN_PATH="$PWD" lake env lean -o InfoGeometry/Algebra/GaussJordan/Rank.olean \
              InfoGeometry/Algebra/GaussJordan/Rank.lean
            LEAN_PATH="$PWD" lake env lean -o InfoGeometry/Algebra/GaussJordan/Elementary.olean \
              InfoGeometry/Algebra/GaussJordan/Elementary.lean
            LEAN_PATH="$PWD" lake env lean -o InfoGeometry/Algebra/GaussJordan.olean \
              InfoGeometry/Algebra/GaussJordan.lean
          } > "$GITHUB_WORKSPACE/gauss-jordan-build.log" 2>&1
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauss-jordan-build-log
          path: gauss-jordan-build.log
          if-no-files-found: error
      - name: Enforce successful kernel check
        if: always()
        run: |
          cat gauss-jordan-build.log
          test "${{ steps.lean-build.outcome }}" = success
