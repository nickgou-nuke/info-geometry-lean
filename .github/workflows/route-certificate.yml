name: Route certificates (Lean and runtime)
on:
  push:
    branches: [feat/functional-route-certificates]
  pull_request:
    paths:
      - 'lean/InfoGeometry/Routing/FunctionalRouteCertificate.lean'
      - 'tools/route_certificate.py'
      - 'tests/test_route_certificate.py'
      - 'tools/infra/check_route_certificate_addition.py'
      - '.github/workflows/route-certificate.yml'
permissions:
  contents: read
concurrency:
  group: route-certificate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  scoped-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Remove read-only checkout credential without traversing submodules
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Install exact repository Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Install the tested CPU diagnostic dependency
        run: python3 -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Sequential runtime tests, Lean proofs, generated certificates and negative test
        run: python3 tools/infra/check_route_certificate_addition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FunctionalRouteCertificateAddition
          path: ${{ runner.temp }}/route-certificate-deliverable
